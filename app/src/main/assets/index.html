<!doctype html>
<html lang="hi-Latn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kezmo Cam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font:14px sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative}
video{width:100%;height:100%;object-fit:contain}
#msg{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;text-shadow:0 1px 3px #000}
#perm{position:absolute;top:45%;left:50%;transform:translateX(-50%)}
button{background:#222;color:#fff;border:0;border-radius:20px;padding:9px 14px;white-space:nowrap}
button.on{background:#ffd23f;color:#000}
#filters{display:flex;gap:6px;overflow-x:auto;padding:10px}
#bar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 20px}
#bar>button{width:90px}
#shot{width:70px!important;height:70px;border-radius:50%;background:#eee;border:4px solid #777}
#shot.video{background:#e33}
#shot.rec{border-radius:18px}
[hidden]{display:none!important}
</style></head><body>
<div id="stage"><video id="v" autoplay playsinline muted></video>
<button id="perm" class="on" hidden>Permission settings kholo</button><div id="msg"></div></div>
<div id="filters"></div>
<div id="bar"><button id="mode">📷 Photo</button><button id="shot" aria-label="Capture"></button><button id="flip">🔄 Flip</button></div>
<script>
const $=id=>document.getElementById(id);
const FILTERS={Normal:'none',Night:'brightness(1.5) contrast(1.1)',Grass:'saturate(1.6) hue-rotate(8deg)',
Flower:'saturate(1.8) brightness(1.05)',Portrait:'brightness(1.08) contrast(0.95) saturate(1.1)',
'B&W':'grayscale(1)',Warm:'sepia(0.3) saturate(1.3)',Cool:'hue-rotate(-12deg) saturate(1.1) brightness(1.03)'};
let stream=null,facing='environment',filter='none',videoMode=false,rec=null,timer=0,starting=false,paused=false,saving=Promise.resolve();
const say=t=>$('msg').textContent=t;

for(const [name,f] of Object.entries(FILTERS)){
  const b=document.createElement('button');b.textContent=name;if(f==='none')b.className='on';
  b.onclick=()=>{filter=f;$('v').style.filter=f;[...$('filters').children].forEach(x=>x.className=x===b?'on':'')};
  $('filters').append(b);
}
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
async function start(){
  if(starting||paused)return;starting=true;stop();say('Camera khul raha hai…');
  const video={facingMode:facing,width:{ideal:1920},height:{ideal:1080}};
  try{
    let s;
    try{s=await navigator.mediaDevices.getUserMedia({video,audio:videoMode})}
    catch(e){if(!videoMode)throw e;s=await navigator.mediaDevices.getUserMedia({video})}
    stream=s;$('v').srcObject=s;$('v').style.transform=facing==='user'?'scaleX(-1)':'';
    $('perm').hidden=true;say('');
    if(paused)stop();
  }catch(e){
    say('Camera nahi khula ('+e.name+')');
    $('perm').hidden=!(window.Android&&e.name==='NotAllowedError');
  }finally{starting=false}
}
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function save(blob,name){
  if(!window.Android){say('Save sirf app ke andar hota hai');return}
  say('Save ho raha hai…');
  const mime=blob.type.split(';')[0];
  let ok=Android.begin(name,mime);
  for(let i=0;ok&&i<blob.size;i+=393216)ok=Android.chunk(await toB64(blob.slice(i,i+393216)));
  ok=ok&&Android.end();
  say(ok?'Gallery me save ho gaya ✅':'Save nahi hua ❌');
}
const queue=(b,n)=>saving=saving.then(()=>save(b,n)).catch(()=>say('Save nahi hua ❌'));
function draw(c){const x=c.getContext('2d');x.filter=filter;x.drawImage($('v'),0,0,c.width,c.height)}
function canvas(){const c=document.createElement('canvas');c.width=$('v').videoWidth;c.height=$('v').videoHeight;return c}
function photo(){
  const c=canvas();draw(c);
  c.toBlob(b=>b?queue(b,'Kezmo_'+Date.now()+'.jpg'):say('Photo nahi bani'),'image/jpeg',0.95);
}
function record(){
  const c=canvas();draw(c);
  const out=c.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));
  const type=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  const parts=[];rec=new MediaRecorder(out,{mimeType:type,videoBitsPerSecond:8e6});
  rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  rec.onstop=()=>{const ext=type.endsWith('mp4')?'.mp4':'.webm';queue(new Blob(parts,{type}),'Kezmo_'+Date.now()+ext)};
  rec.start(1000);timer=setInterval(()=>draw(c),33);
  $('shot').classList.add('rec');say('● Recording');$('mode').disabled=$('flip').disabled=true;
}
function stopRec(){
  if(!rec)return;clearInterval(timer);rec.stop();rec=null;
  $('shot').classList.remove('rec');$('mode').disabled=$('flip').disabled=false;
}
$('shot').onclick=()=>{
  if(!stream||!$('v').videoWidth){start();return}
  if(!videoMode)photo();else if(rec)stopRec();else record();
};
$('mode').onclick=()=>{if(starting)return;videoMode=!videoMode;$('mode').textContent=videoMode?'🎥 Video':'📷 Photo';$('shot').classList.toggle('video',videoMode);start()};
$('flip').onclick=()=>{if(starting)return;facing=facing==='user'?'environment':'user';start()};
$('perm').onclick=()=>Android.openSettings();
window.appPause=()=>{paused=true;const r=rec;if(r){r.addEventListener('stop',stop);stopRec()}else stop()};
window.appResume=()=>{if(paused){paused=false;start()}};
start();
</script></body></html>
