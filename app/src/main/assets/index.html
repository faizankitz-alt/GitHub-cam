<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#ffd23f;--blur:14px;--tint:.14}

button:active{transform:scale(.9)}
button.on{background:var(--accent);color:#000;font-weight:600}
button:disabled{opacity:.35}

 -webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(.92);backdrop-filter:blur(var(--blur)) saturate(190%) brightness(.92);
 border:1px solid #ffffff40;box-shadow:inset 1.5px 1.5px 1px #ffffff66,inset -1px -1px 1px #ffffff30,inset 0 0 14px #ffffff14,0 8px 24px #0005}
body.glass button{background:#ffffff1f;border-color:#ffffff2b;box-shadow:inset 1px 1px 1px #ffffff40;text-shadow:0 1px 2px #0006}
body.glass button.on{background:color-mix(in srgb,var(--accent) 72%,transparent);color:#000;text-shadow:none;box-shadow:inset 1.5px 1.5px 1px #fffa,0 2px 12px color-mix(in srgb,var(--accent) 45%,transparent)}
body.glass button.g:not(.on):active{transform:scale(1.12)}
body.glass .sheet{text-shadow:0 1px 3px #000a}
body.glass .sheet:before{content:'';position:absolute;inset:0;border-radius:inherit;background:#0000003d;z-index:-1}
#stage{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden;touch-action:none}
canvas#view{width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block}
#grid,#level{position:absolute;pointer-events:none}
#grid{background:
 linear-gradient(90deg,transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px)),
 linear-gradient(transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px))}
#level{left:25%;right:25%;top:40%;height:2px;background:#fffc;box-shadow:0 0 4px #000}
#level.flat{background:var(--accent)}
#ring{position:absolute;width:68px;height:68px;margin:-34px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:200;pointer-events:none;text-shadow:0 2px 8px #000}
#perm{position:absolute;top:40%;left:50%;margin-left:-110px;width:220px;background:var(--accent);color:#000}
#top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:3}
#info{font-size:11px;opacity:.75;text-align:center;padding:0 8px}
#msg{position:absolute;left:50%;transform:translateX(-50%);top:66px;max-width:92%;width:max-content;text-align:center;padding:6px 14px;border-radius:16px;z-index:25;pointer-events:none}
#msg:empty{display:none}
#quick{position:absolute;left:8px;right:8px;top:58px;border-radius:26px;padding:12px;z-index:5}
.seg{display:flex;background:#ffffff12;border-radius:16px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none!important;border-color:transparent!important;box-shadow:none!important;border-radius:13px}
.seg button.on{background:var(--accent)!important}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}

.item .row{overflow-x:auto}
.line{display:flex;justify-content:space-between;gap:8px}
#compare{position:absolute;left:10px;bottom:218px;z-index:2}
#side{position:absolute;right:10px;bottom:218px;display:flex;flex-direction:column;gap:10px;z-index:2}
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 0 18px;background:linear-gradient(#0000,#000b 45%);z-index:2;pointer-events:none}

#zoom,#modes{display:flex;gap:4px;width:max-content;margin:0 auto 10px;padding:4px;border-radius:30px}
#zoom button{min-width:40px;height:34px;padding:0 8px;border-radius:17px;background:transparent}
#modes button{background:transparent;border-color:transparent;box-shadow:none;padding:8px 15px}
#zoom button.on,#modes button.on{background:var(--accent)}
body:not(.glass) #modes button.on{background:none;color:var(--accent)}
body:not(.glass) #modes{background:transparent;border-color:transparent}
body:not(.glass) .g{background:rgba(30,30,32,.82);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
body:not(.glass) #modes.g{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
#bar{display:flex;align-items:center;justify-content:space-between;padding:0 34px}
#thumb{width:54px;height:54px;border-radius:16px;padding:0;background-size:cover;background-position:center}
#flip{width:54px;height:54px}
#flip svg{width:28px;height:28px}
#shot{width:78px;height:78px;border-radius:50%;padding:5px;background:transparent;border:4px solid #fff;box-shadow:none}
body.glass #shot{background:#ffffff26;-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);box-shadow:inset 0 0 12px #fff8,0 6px 22px #0006}
#shot i{display:block;width:100%;height:100%;border-radius:50%;background:#ffffffe6;border:3px solid var(--accent);transition:.2s}
#shot.video i{background:#ff3b30;border-color:#ff3b30}
#shot.rec i{border-radius:12px;transform:scale(.55)}
.sheet{position:absolute;left:6px;right:6px;bottom:106px;border-radius:28px;padding:10px;z-index:3;isolation:isolate}
#panel{max-height:34vh;overflow-y:auto;padding:2px}
#tabs{display:flex;gap:4px;margin-bottom:6px}
#tabs button{flex:1 1 auto;padding:7px 2px;font-size:12px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;align-items:center;flex:none}
.row>span{flex:none;min-width:92px}
label{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;padding:5px 0}
label output{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.note{opacity:.7;font-size:11px;padding:4px 0}
input[type=search],input[type=text]{width:100%;background:#ffffff1c;color:#fff;border:0;border-radius:18px;padding:9px 14px;font:inherit}
.wrap{flex-wrap:wrap;overflow:visible}
#more{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;padding:12px 14px 0}

#moreTabs button{flex:1}
#moreBody{overflow-y:auto;padding-bottom:40px}
.card{border-radius:24px;padding:4px 16px;margin-bottom:12px}
.card>*+*{border-top:1px solid #ffffff1f}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0}
.item b{display:block;font-weight:500;font-size:15px}
.item small{display:block;opacity:.6;margin-top:3px}

button.switch.on:after{left:24px}
.dot{width:34px;height:34px;border-radius:50%;flex:none}
button.dot.on{outline:3px solid #fff;outline-offset:2px}
#guide{position:absolute;pointer-events:none}
#guidebar{position:absolute;left:8px;right:8px;top:60px;border-radius:22px;padding:8px 8px 4px;z-index:2;text-align:center}
#guidebar b{display:block;font-size:11px;opacity:.7}
#coach{font-size:14px;line-height:1.35;padding:3px 4px}
#guidebar .row{justify-content:safe center;gap:4px}
#guidebar button{padding:6px 8px;min-width:33px}
body.guiding #msg{top:176px}
#poses,#photo{position:absolute;inset:0;background:#000;z-index:15;display:flex;flex-direction:column;padding:12px 12px 0}
body.glass #poses,body.glass #photo{background:#000c;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
#poses h1,#photo h1{font-size:21px;flex:1}
#kinds{margin:2px 0 8px}
#kinds button{padding:9px 4px}
#poses input[type=search]{flex:none}
#poseGrid,.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;padding:8px 0 30px}
#poseGrid{flex:1;min-height:0;overflow-y:auto}
button.posecard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;border-radius:18px;white-space:normal}
.posecard canvas{width:100%;height:auto}
.posecard span{font-size:11px;line-height:1.25}
.wide{grid-column:1/-1}
#photoBody{overflow-y:auto;padding-bottom:40px;flex:1;min-height:0}
#photoCanvas{display:block;width:100%;max-height:44vh;object-fit:contain;border-radius:18px}
#photoBody h2{font-size:15px;margin:6px 0 8px}
#photoBody .item{font-size:13px;padding:9px 0}
#copyPose{width:100%;padding:13px;margin-bottom:14px}
#photoStatus{font-size:14px;text-align:center;padding:40px 20px}
[hidden]{display:none!important}

function program(fs){
  const p=gl.createProgram();
  for(const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p,s);

  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};return {p,u:n=>n in u?u[n]:(u[n]=gl.getUniformLocation(p,n))};
}

}

// source crop for the chosen aspect ratio. Preview stays at most 1920 px long; recording uses full size.
function geometry(w,h,ratio,limit){

function transform(g,still){

// how noisy is this picture? measured as colour speckle in its calmest patches
const patch=el('canvas',{width:48,height:48});

  const x=patch.getContext('2d',{willReadFrequently:true}),found=[];
  for(let j=0;j<5;j++)for(let i=0;i<5;i++){
    x.drawImage(src,Math.round((i+.5)/5*(w-48)),Math.round((j+.5)/5*(h-48)),48,48,0,0,48,48);const d=x.getImageData(0,0,48,48).data;let sum=0;

  if(direct)out=new MediaStream([track.clone()]);

    rec=true;render(video,video.videoWidth,video.videoHeight); // switch to full size before the stream starts
    if(recTilt){turned(view,recTilt,recCanvas);out=recCanvas.captureStream(S.fps)}else out=view.captureStream(S.fps);
  }
  stream.getAudioTracks().forEach(t=>out.addTrack(t.clone()));
  const long=Math.max(set.width||0,set.height||0),r=new MediaRecorder(out,{mimeType:type,videoBitsPerSecond:long>=3000?45e6:long>=1900?18e6:10e6});
  r.direct=direct;

  r.onerror=()=>{say('Is phone par ye quality record nahi hui, 1080p try karo');stopRec()};
  r.onstop=async()=>{out.getTracks().forEach(t=>t.stop());if(!parts.length)return;let blob=new Blob(parts,{type});
    if(direct&&turn)blob=await turnMp4(blob,turn).catch(()=>blob);
    queue(blob,'Kezmo_'+Date.now()+(type.endsWith('mp4')?'.mp4':'.webm'))};
  try{r.start(1000)}catch(e){rec=null;out.getTracks().forEach(t=>t.stop());say('Recording shuru nahi hui, quality 1080p karke try karo');return}
  rec=r;const began=Date.now(),heavy=!direct&&long>=3000?' • 4K + effect bhaari hai':'';

}

function placesFor(text){
  const words=text.toLowerCase().split(/[\s,/]+/).filter(w=>w.length>2&&!['par','pe','ke','ki','ka','wala','wali','top'].includes(w));
  return PLACES.filter(p=>p[2].split(' ').some(s=>words.some(w=>s.startsWith(w)||(s.length>4&&w.startsWith(s))))).map(p=>p[0]);
}
// poses for the chosen number of people: ones made for the place first, then ones that work anywhere
function findPoses(kind,text,places){
  const mine=POSES.filter(p=>p.kind===kind),q=text.trim().toLowerCase();
  const wanted=places||(q?placesFor(q):[]),named=q?mine.filter(p=>p.name.toLowerCase().includes(q)):[];
  if(!wanted.length&&!named.length)return {list:mine,matched:!q&&!places?.length};
  const here=mine.filter(p=>wanted.some(w=>p.tags.includes(w))),anywhere=mine.filter(p=>p.tags.includes('any'));
  return {list:[...new Set([...named,...here,...anywhere])],matched:true};
}

/* drawing: only the outer line of each body, like a hand drawn guide */
function bodyPath(x,j,seen,extra){

  x.lineCap=x.lineJoin='round';x.strokeStyle=x.fillStyle='#fff';
  const W=(a,b,w)=>line(a,b,w*u);
  W('ls','le',7);W('le','lw',5.5);W('rs','re',7);W('re','rw',5.5);W('lh','lk',9.5);W('lk','la',7);W('rh','rk',9.5);W('rk','ra',7);
  if(seen('ls')&&seen('rs')){
    x.beginPath();x.moveTo(...j.ls);x.lineTo(...j.rs);if(seen('lh')&&seen('rh')){x.lineTo(...j.rh);x.lineTo(...j.lh)}x.closePath();x.lineWidth=7*u+extra;x.fill();x.stroke();
    if(seen('head')){x.lineWidth=5*u+extra;x.beginPath();x.moveTo((j.ls[0]+j.rs[0])/2,(j.ls[1]+j.rs[1])/2);x.lineTo(...j.head);x.stroke()}
  }
  if(seen('head')){x.beginPath();x.arc(j.head[0],j.head[1],7.2*u+extra/2,0,7);x.fill()}
}

function ink(target,paint,color){ // draw on a spare canvas, then put it over the target

}
function drawPose(x,figures,{color='#fff',width=2.2,props=[],wheels=[]}={}){ // x is already scaled to pose units

  if(props.length||wheels.length){x.save();x.strokeStyle=color;x.globalAlpha=.65;x.lineWidth=thin;x.setLineDash([5/s,5/s]);x.lineCap='round';

const FOV=1.44; // height seen at 1 metre, per metre, along the long side of a normal phone main camera
// MediaPipe landmarks -> our joints, in pixels of a W x H picture. "left" here means left on screen.
function fromLandmarks(l,W,H){
  const ids={head:0,ls:12,rs:11,le:14,re:13,lw:16,rw:15,lh:24,rh:23,lk:26,rk:25,la:28,ra:27},j={},ok={};
  for(const k in ids){const [x,y,v]=l[ids[k]];j[k]=[x*W,y*H];ok[k]=v>.45&&x>-.05&&x<1.05&&y>-.05&&y<1.05}
  if(j.ls[0]>j.rs[0])for(const part of ['s','e','w','h','k','a']){const a='l'+part,b='r'+part;[j[a],j[b]]=[j[b],j[a]];[ok[a],ok[b]]=[ok[b],ok[a]]}
  return {j,seen:k=>ok[k]};
}
const middle=(f,a,b)=>[(f.j[a][0]+f.j[b][0])/2,(f.j[a][1]+f.j[b][1])/2];
// a length on the body that is easy to measure, with its real size in metres
function ruler(f){
  if(['ls','rs','lh','rh'].every(f.seen)){const a=middle(f,'ls','rs'),b=middle(f,'lh','rh');return {px:Math.hypot(a[0]-b[0],a[1]-b[1]),m:.5,kind:'torso'}}
  if(f.seen('ls')&&f.seen('rs'))return {px:Math.hypot(f.j.ls[0]-f.j.rs[0],f.j.ls[1]-f.j.rs[1]),m:.37,kind:'shoulder'};
  return null;
}
// camera-to-person distance in metres. longSide = pixel length of the camera picture's long side
const metres=(r,longSide,zoom=1)=>r&&r.px>2?r.m*zoom*longSide/(FOV*r.px):0;
const LIMBS=[['ls','le','left wala haath',38],['rs','re','right wala haath',38],['le','lw','left haath ki kohni',50],['re','rw','right haath ki kohni',50],['lh','lk','left wala pair',30],['rh','rk','right wala pair',30]];
const angleOf=(f,a,b)=>Math.atan2(f.j[b][0]-f.j[a][0],f.j[b][1]-f.j[a][1])*180/Math.PI;
const turnBetween=(a,b)=>((a-b+540)%360)-180;
// compares the people in front of the camera with the guide; both are in pixels of the same upright frame
function judge(live,target){
  const cx=f=>middle(f,'ls','rs')[0],a=[...live].sort((p,q)=>cx(p)-cx(q)),b=[...target].sort((p,q)=>cx(p)-cx(q));
  if(!a.length)return {text:'Insaan frame me lao',score:0};
  if(a.length<b.length)return {text:`${b.length} log chahiye, abhi ${a.length} dikh rahe`,score:0};
  const pairs=b.map((t,i)=>[a[i],t]),mean=list=>list.reduce((s,v)=>s+v,0)/list.length;
  const sizes=[],dx=[],dy=[],wrong=[];let total=0,count=0;
  for(const [p,t] of pairs){
    const rp=ruler(p),rt=ruler(t);
    if(rp&&rt){const key=rp.kind===rt.kind?1:rp.kind==='torso'?.74:1.35;sizes.push(rp.px*key/rt.px);
      const mp=middle(p,'ls','rs'),mt=middle(t,'ls','rs');dx.push(mp[0]-mt[0]);dy.push(mp[1]-mt[1])}
    for(const [from,to,name,limit] of LIMBS){
      if(!(t.seen(from)&&t.seen(to)&&p.seen(from)&&p.seen(to)))continue;
      const now=angleOf(p,from,to),want=angleOf(t,from,to),off=Math.abs(turnBetween(want,now));total+=Math.min(off,90);count++;
      if(off>limit){const arm=to[1]==='e'||to[1]==='w',hint=arm?(Math.abs(want)>Math.abs(now)?'upar uthao':'neeche karo'):(turnBetween(want,now)>0?'screen ke right ki taraf':'screen ke left ki taraf');
        wrong.push({off:off-limit,text:`${pairs.length>1?(pairs.findIndex(x=>x[0]===p)+1)+' number insaan: ':''}Screen par ${name} ${hint}`})}
    }
  }
  const size=sizes.length?mean(sizes):1,shiftX=dx.length?mean(dx):0,shiftY=dy.length?mean(dy):0;
  return {size,shiftX,shiftY,wrong:wrong.sort((p,q)=>q.off-p.off),score:Math.max(0,Math.round(100-(count?mean([total/count])*1.7:40)))};
}
const coachCanvas=el('canvas');
async function coach(){
  if(!guide||!coachOn||coachBusy||busy||rec||!stream||paused||!$('poses').hidden||!$('photo').hidden||performance.now()-coachAt<300)return;
  coachBusy=true;const mine=guide;
  try{
    const turn=S.ui.rotate?tilt:0,k=Math.min(1,480/Math.max(view.width,view.height)),small=el('canvas',{width:Math.round(view.width*k),height:Math.round(view.height*k)});
    small.getContext('2d').drawImage(view,0,0,small.width,small.height);
    const input=turn?turned(small,turn,coachCanvas):small,W=input.width,H=input.height;
    const out=await ask('pose',input,W,H);
    if(guide!==mine)return;
    const live=out.people.map(l=>fromLandmarks(l,W,H)),p=placement(W,H);
    const target=guide.figures.map(f=>{const j={};for(const key of JOINTS){let x=(f.j[key][0]-p.mid[0])*p.k*(guide.mirror?-1:1)+p.cx,y=(f.j[key][1]-p.mid[1])*p.k+p.cy;j[key]=[x,y]}
      if(guide.mirror)for(const part of ['s','e','w','h','k','a'])[j['l'+part],j['r'+part]]=[j['r'+part],j['l'+part]];return {j,seen:f.seen}});
    const r=judge(live,target);
    // distance: how much of the camera's long side the body covers
    const longSource=Math.max(video.videoWidth,video.videoHeight),upSource=Math.abs(turn)===90?video.videoWidth*Math.abs(lastT.scale[0]):video.videoHeight*lastT.scale[1];
    const near=live[0]&&ruler(live[0]),away=near?metres({px:near.px*upSource/H,m:near.m},longSource,S.hw[facing].zoom||1):0;
    let text=r.text;
    if(!text){
      if(r.size>1.2)text='Thoda door jao (ya camera peeche lo)';
      else if(r.size<.83)text='Thoda paas aao (ya camera aage lao)';
      else if(Math.abs(r.shiftX)>W*.09)text=r.shiftX<0?'Screen par thoda right khisko':'Screen par thoda left khisko';
      else if(Math.abs(r.shiftY)>H*.09)text=r.shiftY>0?'Camera thoda neeche jhukao':'Camera thoda upar uthao';
      else if(r.wrong.length&&r.score<80)text=r.wrong[0].text;
      else text=r.score>=70?'Perfect! Photo lo ✅':r.wrong[0]?.text||'Outline ke andar aao';
    }
    guideGood=text.startsWith('Perfect');
    const line=$('coach');if(line)line.textContent=`${text}${away?` • abhi lagbhag ${away.toFixed(1)} m`:''}${r.score?` • match ${r.score}%`:''}`;
    drawGuide();
  }catch(e){if(e.message!=='retry'){console.warn('coach',e);coachOn=false;guideBar('Coach is phone par nahi chala. Outline dekh kar pose karo.')}}
  finally{coachBusy=false;coachAt=performance.now()}

function placeColours(c,mask,mw,mh){

  for(const f of people.slice(0,4)){
    const torso=['ls','rs','lh','rh'].filter(f.seen),pts=torso.length?torso:['head'];
    const at={x:clamp(pts.reduce((s,k)=>s+f.j[k][0],0)/pts.length/c.width,0,1),y:clamp(pts.reduce((s,k)=>s+f.j[k][1],0)/pts.length/c.height,0,1)};
    for(const name of ['object','person']){
      const o=await attempt(name,at);if(!o.mask)continue;
      const area=o.mask.reduce((s,v)=>s+(v>110),0)/o.mask.length;
      if(area<.004||area>.75||covers(o,f,c.width,c.height)<.55)continue;
      if(!union)union={mask:new Uint8Array(o.mask),w:o.w,h:o.h};
      else if(union.w===o.w&&union.h===o.h)for(let i=0;i<o.mask.length;i++)union.mask[i]=Math.max(union.mask[i],o.mask[i]);
      break;
    }
  }
  return union;
}
function maskCanvas(mask,w,h){
  const c=el('canvas',{width:w,height:h}),x=c.getContext('2d'),d=x.createImageData(w,h);
  for(let i=0;i<w*h;i++){d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=255;d.data[i*4+3]=mask[i]>110?255:0}
  x.putImageData(d,0,0);return c;
}
let imported=null,photoView='all',importJob=0;
async function importPhoto(file){
  const job=++importJob,box=$('photo');$('poses').hidden=true;showSheet(false);$('guide').hidden=true;$('guidebar').hidden=true;box.hidden=false;
  const status=t=>{box.textContent='';box.append(el('div',{className:'head'},iconButton('back','Wapas',{onclick:closePhoto}),el('h1',{textContent:'Photo'})),el('div',{id:'photoStatus',className:'note',textContent:t}))};
  status('Photo khol raha hoon…');
  try{
    const bmp=await createImageBitmap(file),k=Math.min(1,960/Math.max(bmp.width,bmp.height)),c=el('canvas',{width:Math.round(bmp.width*k),height:Math.round(bmp.height*k)});
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close();
    status('AI insaan, cheezein aur background alag kar raha hai… pehli baar thoda time lagta hai');
    const attempt=async(name,at)=>{for(let i=0;i<2;i++){try{return await wait(ask(name,c,c.width,c.height,at),60000)}catch(e){if(e.message!=='retry'||i){console.warn('import',name,e);return {error:String(e.message||e)}}}}};
    let body=await attempt('poseRef');
    if(!body.people?.length){const other=await attempt('pose');if(other.people?.length)body=other} // smaller model as a second try
    const things=await attempt('things');
    if(job!==importJob||box.hidden)return;
    const people=(body.people||[]).map(l=>fromLandmarks(l,c.width,c.height)).filter(f=>f.seen('ls')||f.seen('rs')||f.seen('head'));
    const cut=await silhouettes(c,people,attempt);
    if(job!==importJob||box.hidden)return;
    const place=placeColours(c,cut?.mask,cut?.w,cut?.h),objects=(things.things||[]).filter(t=>t.name!=='person');
    const tags=[...new Set([...objects.map(t=>THING_PLACES[t.name]).filter(Boolean),...place.found])];
    imported={c,people,objects,place,tags,mask:cut?maskCanvas(cut.mask,cut.w,cut.h):null,error:body.error||things.error||''};
    photoView='all';showImport();
  }catch(e){console.warn(e);if(job===importJob)status('Ye photo nahi khul payi. JPG ya PNG photo chuno.')}
}
function closePhoto(){importJob++;$('photo').hidden=true;if(guide){$('guidebar').hidden=false;drawGuide()}}
function paintImport(canvas){
  const {c,mask,people,objects}=imported,W=c.width,H=c.height;canvas.width=W;canvas.height=H;const x=canvas.getContext('2d');
  const cut=keep=>{const t=el('canvas',{width:W,height:H}),q=t.getContext('2d');q.drawImage(c,0,0);if(mask){q.globalCompositeOperation=keep?'destination-in':'destination-out';q.drawImage(mask,0,0,W,H)}return t};
  if(photoView==='people'){x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(cut(true),0,0)}
  else if(photoView==='back'){x.fillStyle='#333';x.fillRect(0,0,W,H);x.drawImage(cut(false),0,0)}
  else x.drawImage(c,0,0);
  if(photoView==='things'){const s=Math.max(W,H)/960;x.lineWidth=3*s;x.font=`600 ${26*s}px sans-serif`;
    for(const t of objects){x.strokeStyle='#ffd23f';x.strokeRect(t.x*W,t.y*H,t.w*W,t.h*H);const text=THINGS[t.name]||t.name,w=x.measureText(text).width+12*s;x.fillStyle='#ffd23f';x.fillRect(t.x*W,Math.max(0,t.y*H-32*s),w,32*s);x.fillStyle='#000';x.fillText(text,t.x*W+6*s,Math.max(24*s,t.y*H-8*s))}}
  if(photoView==='all'&&people.length){x.save();x.scale(1,1);for(const f of people){x.strokeStyle='#ffd23f';x.lineWidth=Math.max(W,H)/300;x.lineCap='round';
    for(const [a,b] of [['ls','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']])if(f.seen(a)&&f.seen(b)){x.beginPath();x.moveTo(...f.j[a]);x.lineTo(...f.j[b]);x.stroke()}}x.restore()}
}
function advice(){
  const {c,people}=imported;if(!people.length)return [];
  const wide=c.width>c.height,longSide=wide?c.height*4/3:Math.max(c.height,c.width),rulers=people.map(ruler).filter(Boolean);
  const list=[`Phone ${wide?'aada (landscape)':'seedha (portrait)'} pakdo.`];
  if(rulers.length){const d=rulers.map(r=>metres(r,longSide)).sort((a,b)=>a-b)[0];
    list.push(`Camera aur insaan ke beech lagbhag ${d.toFixed(1)} m (1× zoom), 2× zoom par lagbhag ${(d*2).toFixed(1)} m. Ye andaza hai.`)}
  const xs=people.map(f=>middle(f,'ls','rs')[0]/c.width),x=xs.reduce((a,b)=>a+b,0)/xs.length;
  list.push(`Insaan frame ke ${x<.4?'left':x>.6?'right':'beech'} me rakho.`);
  const feet=people.some(f=>f.seen('la')||f.seen('ra')),hips=people.some(f=>f.seen('lh')||f.seen('rh'));
  list.push(feet?'Poora sharir, pair samet, frame me aaye.':hips?'Kamar/ghutne tak ka shot hai, pair frame se bahar.':'Close-up shot hai: chehra aur kandhe.');
  return list;
}
function useImported(){
  const {c,people,mask,tags}=imported,figures=people;
  let box=boxOf(figures);
  if(mask){ // fit the box to the real silhouette
    const q=mask.getContext('2d').getImageData(0,0,mask.width,mask.height).data;let a=1e9,b=1e9,e=0,f=0;
    for(let y=0;y<mask.height;y++)for(let x=0;x<mask.width;x++)if(q[(y*mask.width+x)*4+3]){a=Math.min(a,x);b=Math.min(b,y);e=Math.max(e,x);f=Math.max(f,y)}
    if(e>a)box={x:a*c.width/mask.width,y:b*c.height/mask.height,w:(e-a)*c.width/mask.width,h:(f-b)*c.height/mask.height};
  }
  guide={name:'Photo wala pose',tip:advice().slice(0,2).join(' '),figures,props:[],wheels:[],box,people:people.length,list:[],pose:null,dx:0,dy:0,size:1,mirror:false,ref:{w:c.width,h:c.height,outline:mask}};
  openGuide();
}
function showImport(){
  const box=$('photo'),{people,objects,place,tags,error}=imported,canvas=el('canvas',{id:'photoCanvas'});box.textContent='';
  const views=[['all','Poori photo'],...(imported.mask?[['people','Sirf insaan'],['back','Sirf background']]:[]),['things',`Cheezein (${objects.length})`]];
  const names=[...new Set(objects.map(t=>THINGS[t.name]||t.name))];
  const kind=people.length>=3?'triple':people.length===2?'couple':'single';
  const lines=el('div',{className:'card g'},...[
    `Log: ${people.length||'koi nahi mila'}`,`Cheezein: ${names.join(', ')||'koi pehchani nahi'}`,`Jagah ka andaza: ${[place.label,...tags.map(t=>PLACES.find(p=>p[0]===t)?.[1])].filter(Boolean).slice(0,4).join(', ')||'saaf pata nahi'}`
  ].map(t=>el('div',{className:'item',textContent:t})));
  paintImport(canvas);
  const suggested=findPoses(kind,'',tags.length?tags:null).list.slice(0,8);
  box.append(el('div',{className:'head'},iconButton('back','Wapas',{onclick:closePhoto}),el('h1',{textContent:'Photo'}),chip('Doosri photo',false,()=>$('pick').click())),
    el('div',{id:'photoBody'},canvas,el('div',{className:'row'},...views.map(([id,label])=>chip(label,photoView===id,()=>{photoView=id;showImport()}))),
      ...(error?[el('div',{className:'note',textContent:'Kuch AI is phone par nahi chala: '+error.slice(0,140)})]:[]),lines,
      ...(people.length?[el('div',{className:'card g'},...advice().map(t=>el('div',{className:'item',textContent:t}))),el('button',{id:'copyPose',className:'on',textContent:'Ye pose camera par lagao',onclick:useImported})]:[]),
      el('h2',{textContent:'Is photo ke hisaab se aur poses'}),
      el('div',{className:'seg'},...KINDS.map(([id,label])=>el('button',{textContent:label,onclick:()=>{poseKind=id;poseQuery='';posePlaces=tags.length?tags:null;$('photo').hidden=true;openPoses()}}))),
      el('div',{id:'photoPoses',className:'grid3'},...suggested.map(p=>poseCard(p,suggested)))));
}
$('pick').onchange=e=>{const file=e.target.files[0];e.target.value='';if(file)importPhoto(file)};
