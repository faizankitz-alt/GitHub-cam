<title>Kezmo Cam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font:13px sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column}
button{background:#222;color:#fff;border:0;border-radius:18px;padding:8px 12px;white-space:nowrap;font:inherit}
button.on{background:#ffd23f;color:#000}
button:disabled{opacity:.4}
#top{display:flex;gap:6px;overflow-x:auto;padding:8px;flex:none}
#top button{flex:1}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
canvas#view{width:100%;height:100%;object-fit:contain;display:block}
#grid{position:absolute;pointer-events:none;background:
 linear-gradient(90deg,transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px)),
 linear-gradient(transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px))}
#ring{position:absolute;width:64px;height:64px;margin:-32px;border:2px solid #ffd23f;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s}
#msg,#info{position:absolute;left:8px;right:8px;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}
#msg{bottom:8px}#info{top:6px;font-size:11px;opacity:.85}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;pointer-events:none;text-shadow:0 2px 8px #000}
#perm{position:absolute;top:45%;left:50%;transform:translateX(-50%)}
#compare{position:absolute;right:8px;bottom:34px;background:#0009}
#panel{flex:none;max-height:34vh;overflow-y:auto;padding:6px 10px;background:#101010}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;align-items:center}
.row>span{flex:none;min-width:92px}
label{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;padding:5px 0}
label output{text-align:right}
input[type=range]{width:100%;accent-color:#ffd23f;height:26px}
.note{opacity:.65;font-size:11px;padding:4px 0}
#tabs{display:flex;gap:6px;padding:6px 8px;flex:none}
#tabs button{flex:1 1 auto;padding:8px 2px;font-size:12px}
input[type=search]{width:100%;background:#222;color:#fff;border:0;border-radius:18px;padding:9px 14px;font:inherit}
.wrap{flex-wrap:wrap;overflow:visible}
#bar{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 14px;flex:none}
#bar>button{width:92px}
#shot{width:66px!important;height:66px;border-radius:50%;background:#eee;border:4px solid #777}
#shot.video{background:#e33}
#shot.rec{border-radius:18px}
[hidden]{display:none!important}

<script>
'use strict';
const $=id=>document.getElementById(id), video=$('v'), view=$('view');
const el=(tag,props={},...kids)=>{const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e};
const say=t=>$('msg').textContent=t;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

/* ---------- filter parameters: [key, label, min, max] ---------- */
const PARAMS=[['exposure','Exposure',-100,100],['contrast','Contrast',-100,100],['highlights','Highlights',-100,100],['shadows','Shadows',-100,100],
['fade','Fade',0,100],['saturation','Saturation',-100,100],['vibrance','Vibrance',-100,100],['warmth','Warmth',-100,100],['tint','Tint',-100,100],
['hue','Hue',-100,100],['reds','Red / Pink',-100,100],['greens','Green',-100,100],['blues','Blue / Sky',-100,100],['teal','Teal shadows',-100,100],
['gold','Gold highlights',-100,100],['sharpness','Sharpness',0,100],['clarity','Clarity',-100,100],['vignette','Vignette',0,100],['grain','Grain',0,100],['log','LOG (flat) profile',0,100]];
// short codes: e c h s f sa vi w t hu r g b te go sh cl vg gr
const CODES=['e','c','h','s','f','sa','vi','w','t','hu','r','g','b','te','go','sh','cl','vg','gr','lg'];
const PRESETS={
'Normal':{},
'LOG Flat':{lg:100},
'LOG Cinema':{lg:70,te:40,go:25,vi:15},
'Selfie Bright':{e:14,s:25,w:6,cl:-22,vi:10},

'Glow Up':{e:15,cl:-45,go:22,vi:22,s:15},
'Sunkissed':{w:38,go:45,s:22,vi:18,c:8},
'Honey':{w:42,go:30,sa:6,f:14,r:10},
'Berry':{t:40,te:20,sa:14,c:15,r:25},

'Aqua':{te:55,w:-22,b:35,vi:20},
'Coffee':{w:28,sa:-35,c:20,f:12,vg:25},
'Caramel':{w:35,sa:-10,go:38,c:15,r:15},
'Milky':{e:18,c:-30,f:38,sa:-8,cl:-30},
'Ice':{w:-50,e:15,h:12,sa:-10,cl:10},
'Neon':{sa:45,vi:60,c:30,t:18,cl:35},
'Cyberpunk':{t:45,te:75,w:-25,c:30,b:40,sa:20},
'Purple Haze':{t:55,w:-10,f:30,te:20,vg:20},
'Y2K':{e:12,c:25,sa:25,t:15,gr:25,f:15},
'Disposable':{c:25,w:18,gr:45,vg:45,f:18,e:6},
'Polaroid':{f:40,w:10,c:5,sa:-8,go:30,te:25},
'Candy':{sa:30,vi:35,t:20,e:12,s:20},
'Tropical':{vi:55,g:30,b:30,w:10,c:15},
'Autumn':{w:30,r:35,g:-45,go:30,c:15},
'Cherry Blossom':{t:25,r:35,e:14,h:-15,f:15,b:-10},
'Emerald':{g:45,te:45,c:18,t:-18},
'Midnight':{e:-20,w:-35,c:25,te:40,vg:45},
'Noir':{sa:-100,c:70,e:-10,vg:55},
'Silver':{sa:-100,e:12,c:20,cl:30,s:25},
'Cine Teal':{c:22,h:-15,s:8,sa:-5,vi:18,te:55,go:18,b:10,vg:18,cl:10},
'Rich Street':{e:-6,c:38,s:-18,sa:12,vi:20,r:35,w:14,te:30,go:22,cl:25,vg:25},
'Lotus Vivid':{e:8,c:14,s:18,sa:18,vi:35,r:25,g:20,b:40,sh:30,cl:15},
'Himalaya':{c:18,s:22,h:-10,sa:15,vi:40,g:40,b:35,w:5,sh:35,cl:30},
'Golden Hour':{e:2,c:12,w:48,t:8,sa:10,vi:15,go:40,h:-12,vg:20},
'Sunset Haze':{w:35,t:18,f:18,go:35,sa:12,h:-8,c:6},
'Deep Lake':{e:-8,c:28,te:65,b:25,sa:-4,w:-12,vg:30},
'Orange Teal':{c:20,te:70,go:45,vi:15,r:10},
'Moody':{e:-15,c:25,s:-20,sa:-22,te:25,vg:40,gr:12},
'Dark Forest':{e:-12,c:22,g:-10,sa:-12,w:-8,te:35,s:-15,vg:35,cl:20},
'Fresh Green':{e:6,g:55,vi:20,s:15,w:-4,sh:20},
'Blue Sky':{b:60,vi:20,c:12,h:-20,w:-6},
'Flower Pop':{r:45,vi:38,sa:12,e:5,sh:25,vg:15},
'Night':{e:38,s:45,h:-25,c:8,sa:5,cl:10},
'Night City':{e:15,c:22,s:20,t:20,te:50,b:25,vi:25,vg:22},
'Bright':{e:18,s:20,c:5,vi:10},
'Soft Portrait':{e:8,c:-8,s:15,h:-10,w:10,r:8,vi:8,cl:-25},
'Skin Glow':{e:10,w:16,t:6,s:18,cl:-35,h:-8,go:15},
'Pink Dream':{t:28,r:25,f:22,e:8,c:-8,go:10},
'Pastel':{f:35,c:-18,e:12,sa:-12,vi:10,t:6},
'Matte':{f:45,c:10,sa:-10,s:-5},
'Film Classic':{c:14,f:20,w:14,sa:-8,go:20,te:15,gr:28,vg:22},
'Vintage 90s':{f:30,w:28,t:-6,sa:-18,gr:40,vg:30,go:25},
'Retro Fade':{f:55,w:12,t:14,sa:-15,te:20,gr:18},
'Warm':{w:35,sa:5},
'Cool':{w:-35,b:10},
'Winter':{w:-28,e:12,sa:-18,b:15,h:-10,f:10},
'Desert':{w:30,c:18,r:12,g:-30,b:-15,go:35,cl:20},
'Monsoon':{e:-6,w:-15,g:25,te:30,c:12,sa:-5,cl:18},
'HDR Pop':{h:-45,s:50,c:15,vi:30,cl:55,sh:30},
'Crisp':{sh:55,cl:30,c:10,vi:10},
'Dreamy':{cl:-55,e:12,f:20,w:8,h:-10},
'B&W':{sa:-100,c:15},
'B&W Hard':{sa:-100,c:55,cl:35,vg:35,gr:15},
'B&W Soft':{sa:-100,f:30,c:-8,e:8},
'Sepia':{sa:-100,go:55,w:55,f:15,vg:20}};
const zeros=()=>Object.fromEntries(PARAMS.map(p=>[p[0],0]));
const presetVals=code=>{const o=zeros();for(const k in code)o[PARAMS[CODES.indexOf(k)][0]]=code[k];return o};

const PORTRAIT=[['blur','Background blur',0,100,60],['sizeX','Focus width',10,100,45],['sizeY','Focus height',10,100,60],['feather','Edge softness',1,100,40],
['bgDark','Background dark',0,100,15],['bgSat','Background color',-100,100,0],['light','Subject light',-50,50,8],['smooth','Skin smooth',0,100,30]];
const MODES=['AI Aadmi','AI Cheez (tap)','Oval'];
const DEF_TOP={timer:0,grid:false,aspect:0};
const defaultsLow=()=>({preset:'Normal',edits:{},strengths:{},lens:'None',
portrait:{on:false,mode:0,x:.5,y:.5,...Object.fromEntries(PORTRAIT.map(p=>[p[0],p[4]]))},
res:1,fps:30,mirror:true,steady:false,steadyAmt:60,hdPhoto:true,jpeg:97,hw:{environment:{},user:{}}});
const defaults=()=>({...defaultsLow(),...DEF_TOP,facing:'environment',videoMode:false});
let S=defaults(),custom={};
try{const d=JSON.parse(localStorage.getItem('kezmo3')||'{}');if(d.S)S={...S,...d.S,portrait:{...S.portrait,...d.S.portrait}};custom=d.custom||{}}catch(e){}
const persist=()=>{try{localStorage.setItem('kezmo3',JSON.stringify({S,custom}))}catch(e){}};
const original=n=>custom[n]?{...zeros(),...custom[n]}:presetVals(PRESETS[n]||{});
const cur=()=>S.edits[S.preset]||original(S.preset);        // every filter keeps its own edits
const strength=()=>S.strengths[S.preset]??100;
const edit=(k,x)=>{S.edits[S.preset]={...cur(),[k]:x}};
const ASPECTS=[['Full',0],['9:16',9/16],['3:4',3/4],['1:1',1]], RES=[['720p',1280,720],['1080p',1920,1080],['4K',3840,2160]];
let stream=null,track=null,facing=S.facing,videoMode=S.videoMode,rec=null,starting=false,restart=false,paused=false,torchOn=false,comparing=false,aim={x:.5,y:.5},busy=false,
countdown=0,tab='Filters',query='',saving=Promise.resolve();

/* ---------- WebGL ---------- */
let gl,progMain,progCopy,progBlur,vtex,mtex,fbos=[],fboW=0,fboH=0;
const glc=document.createElement('canvas');
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS_COPY=`precision mediump float;varying vec2 v;uniform sampler2D tex,maskTex;uniform vec2 scale,off;uniform float weighted;void main(){
 vec2 uv=.5+(v-.5)*scale+off;
 float a=weighted>.5?max(.02,1.-smoothstep(.15,.6,texture2D(maskTex,uv).r)):1.;
 gl_FragColor=vec4(texture2D(tex,uv).rgb*a,a);}`;
const FS_BLUR=`precision mediump float;varying vec2 v;uniform sampler2D tex;uniform vec2 dir;void main(){
 vec4 c=texture2D(tex,v)*.227027;
 c+=(texture2D(tex,v+dir*1.3846)+texture2D(tex,v-dir*1.3846))*.316216;
 c+=(texture2D(tex,v+dir*3.2308)+texture2D(tex,v-dir*3.2308))*.070270;
 gl_FragColor=c;}`;
const FS_MAIN=`precision highp float;varying vec2 v;uniform sampler2D tex,soft,maskTex;uniform vec2 scale,off,px;uniform float seed,aspect,srcAspect,useMask;uniform vec4 warp[4];
uniform float ${PARAMS.map(p=>p[0]==='log'?'logAmt':p[0]).join(',')};
uniform float pOn,pX,pY,sizeX,sizeY,feather,bgDark,bgSat,light,smoothAmt;
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}
void main(){
 vec2 uv=.5+(v-.5)*scale+off;
 if(warp[0].z>0.){vec2 d=(uv-warp[0].xy)*vec2(1.,1./srcAspect);float r=length(d)/warp[0].z;if(r<1.)uv=warp[0].xy+(uv-warp[0].xy)*(1.-warp[0].w*(1.-r*r)*(1.-r*r));}
 if(warp[1].z>0.){vec2 d=(uv-warp[1].xy)*vec2(1.,1./srcAspect);float r=length(d)/warp[1].z;if(r<1.)uv=warp[1].xy+(uv-warp[1].xy)*(1.-warp[1].w*(1.-r*r)*(1.-r*r));}
 if(warp[2].z>0.){vec2 d=(uv-warp[2].xy)*vec2(1.,1./srcAspect);float r=length(d)/warp[2].z;if(r<1.)uv=warp[2].xy+(uv-warp[2].xy)*(1.-warp[2].w*(1.-r*r)*(1.-r*r));}
 if(warp[3].z>0.){vec2 d=(uv-warp[3].xy)*vec2(1.,1./srcAspect);float r=length(d)/warp[3].z;if(r<1.)uv=warp[3].xy+(uv-warp[3].xy)*(1.-warp[3].w*(1.-r*r)*(1.-r*r));}
 vec3 c=texture2D(tex,uv).rgb;
 vec3 n1=texture2D(tex,uv+vec2(px.x,0.)).rgb,n2=texture2D(tex,uv-vec2(px.x,0.)).rgb,n3=texture2D(tex,uv+vec2(0.,px.y)).rgb,n4=texture2D(tex,uv-vec2(0.,px.y)).rgb;
 float bg=0.;
 if(pOn>.5){
  if(useMask>.5){bg=1.-smoothstep(.5-feather*.45,.5+feather*.45,texture2D(maskTex,uv).r);}
  else{vec2 d=(v-vec2(pX,pY))/vec2(sizeX*.6,sizeY*.6);bg=smoothstep(1.-feather*.5,1.+feather,length(d));}
  float skin=step(c.b,c.g)*step(c.g,c.r)*smoothstep(.04,.12,c.r-c.b)*(1.-bg);
  if(smoothAmt>0.&&skin>0.){
   vec3 sum=c;float tw=1.;
   for(int i=0;i<12;i++){float a=float(i)*2.39996,r=2.+float(i)*.7;
    vec3 q=texture2D(tex,uv+vec2(cos(a),sin(a))*px*r).rgb;float w=max(0.,1.-length(q-c)*5.);sum+=q*w;tw+=w;}
   c=mix(c,sum/tw,smoothAmt*skin);
  }
  c+=(c-(n1+n2+n3+n4)*.25)*sharpness*1.6*(1.-bg);
  vec4 sf=texture2D(soft,v);c=mix(c,sf.rgb/max(sf.a,.004),bg);
 } else c+=(c-(n1+n2+n3+n4)*.25)*sharpness*1.6;
 if(clarity!=0.){vec3 s=vec3(0.);
  if(pOn>.5){for(int i=0;i<8;i++){float a=float(i)*.7854;s+=texture2D(tex,uv+vec2(cos(a),sin(a))*px*9.).rgb;}s/=8.;}else s=texture2D(soft,v).rgb;
  c+=(c-s)*clarity*(1.-bg)*(clarity>0.?.8:.6);}
 c*=pow(2.,exposure);
 c=(c-.5)*(1.+contrast*.7)+.5;
 float l=clamp(lum(c),0.,1.);
 c+=highlights*.3*smoothstep(.4,1.,l);
 c+=shadows*.3*(1.-smoothstep(0.,.6,l));
 c+=vec3(warmth*.12+tint*.04,-tint*.09,-warmth*.12+tint*.04);
 c=clamp(c,0.,1.);
 if(hue!=0.){float a=hue*.6,cs=cos(a),sn=sin(a);vec3 k=vec3(.57735);c=c*cs+cross(k,c)*sn+k*dot(k,c)*(1.-cs);c=clamp(c,0.,1.);}
 float rm=clamp((c.r-max(c.g,c.b))*3.,0.,1.),gm=clamp((c.g-max(c.r,c.b))*4.+(min(c.r,c.g)-c.b),0.,1.),bm=clamp((c.b-max(c.r,c.g*.85))*3.,0.,1.);
 l=lum(c);
 c=mix(vec3(l),c,1.+reds*rm*.8+greens*gm*.8+blues*bm*.8);
 float sat=max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b));
 c=mix(vec3(lum(c)),c,max(0.,(1.+saturation)*(1.+vibrance*(1.-clamp(sat,0.,1.))*.9)));
 l=clamp(lum(c),0.,1.);
 c+=teal*vec3(-.12,.04,.09)*(1.-smoothstep(0.,.65,l))*smoothstep(0.,.15,l);
 c+=gold*vec3(.11,.04,-.09)*smoothstep(.35,.9,l);
 c=c*(1.-fade*.22)+fade*.16;
 if(logAmt>0.){vec3 f=.09+.62*log2(1.+max(c,0.)*7.)/3.;f=mix(vec3(lum(f)),f,.65);c=mix(c,f,logAmt);}
 if(pOn>.5){c=mix(vec3(lum(c)),c,1.+bgSat*bg);c*=1.-bgDark*.7*bg;c*=1.+light*(1.-bg);}
 vec2 q=(v-.5)*vec2(aspect,1.)/length(vec2(aspect,1.))*2.;
 c*=1.-vignette*.75*smoothstep(.35,1.05,length(q));
 if(grain>0.){float n=fract(sin(dot(gl_FragCoord.xy+seed,vec2(12.9898,78.233)))*43758.5453);c+=(n-.5)*grain*.22;}
 gl_FragColor=vec4(clamp(c,0.,1.),1.);}`;

function program(fs){
  const p=gl.createProgram();
  for(const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p,s);
  }
  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};return {p,u:n=>n in u?u[n]:(u[n]=gl.getUniformLocation(p,n))};
}
function texture(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  for(const [k,x] of [['MIN_FILTER','LINEAR'],['MAG_FILTER','LINEAR'],['WRAP_S','CLAMP_TO_EDGE'],['WRAP_T','CLAMP_TO_EDGE']])gl.texParameteri(gl.TEXTURE_2D,gl['TEXTURE_'+k],gl[x]);
  if(w)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return t;
}
function initGL(){
  gl=glc.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
  if(!gl){say('Is phone par filter engine (WebGL) nahi chala');return}
  progMain=program(FS_MAIN);progCopy=program(FS_COPY);progBlur=program(FS_BLUR);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  vtex=texture();mtex=texture();fbos=[];fboW=0;AI.mask=null;
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,mtex);gl.activeTexture(gl.TEXTURE0);
}
glc.addEventListener('webglcontextlost',e=>e.preventDefault());
glc.addEventListener('webglcontextrestored',initGL);

// source crop for the chosen aspect ratio. Preview stays at most 1920 px long; recording uses full size.
function geometry(w,h,ratio,limit){
  const want=ratio||ASPECTS[S.aspect][1];let sx=1,sy=1;
  if(want){if(w/h>want)sx=want*h/w;else sy=w/h/want}
  let W=w*sx,H=h*sy;const k=Math.min(1,limit/Math.max(W,H));
  return {sx,sy,W:Math.round(W*k/2)*2,H:Math.round(H*k/2)*2};
}
function transform(g,still){
  const zoom=S.steady&&!still?1-MARGIN*2:1;
  return {scale:[g.sx*zoom*(facing==='user'&&S.mirror?-1:1),g.sy*zoom],off:S.steady&&!still?[steady.cx*g.sx,-steady.cy*g.sy]:[0,0]};
}
let lastT=transform({sx:1,sy:1},true);
function render(src,w,h,{target=view,still=false,ratio=0}={}){
  if(!gl||gl.isContextLost())return;
  const limit=still?Math.min(4096,gl.getParameter(gl.MAX_TEXTURE_SIZE)):rec?3840:1920;
  const g=geometry(w,h,ratio,limit),t=transform(g,still),{scale,off}=t;if(!still)lastT=t;

  lastTime=video.currentTime;
  think(video,video.videoWidth,video.videoHeight);
  if(S.lens!=='None'&&AI.tasks.face){const none=performance.now()-AI.seen>1500;if(none)say('Chehra camera ke saamne lao');else if($('msg').textContent.startsWith('Chehra'))say('')}
  render(video,video.videoWidth,video.videoHeight);
}

/* ---------- camera ---------- */
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=track=null}
async function start(){
  if(paused)return;if(starting){restart=true;return}
  starting=true;stop();resetSteady();forgetAI();say('Camera khul raha hai…');
  const [,w,h]=RES[S.res],want={facingMode:facing,width:{ideal:w},height:{ideal:h},frameRate:{ideal:S.fps}};
  try{
    let s;
    try{s=await navigator.mediaDevices.getUserMedia({video:want,audio:videoMode?{echoCancellation:true,noiseSuppression:true}:false})}
    catch(e){if(!videoMode)throw e;s=await navigator.mediaDevices.getUserMedia({video:want})}
    stream=s;track=s.getVideoTracks()[0];video.srcObject=s;await video.play().catch(()=>{});
    $('perm').hidden=true;say('');
    if(paused)stop();
    // some phones report torch and zoom a moment after the camera opens
    for(const wait of [300,1200])setTimeout(async()=>{if(track===s.getVideoTracks()[0]){await applyHardware();info();if(wait>1000&&tab==='Camera')panel()}},wait);
  }catch(e){
    say('Camera nahi khula ('+e.name+')');
    $('perm').hidden=!(window.Android&&e.name==='NotAllowedError');
  }finally{starting=false;if(restart){restart=false;start()}}
}
const caps=()=>track&&track.getCapabilities?track.getCapabilities():{};
// applyConstraints replaces everything set before, so all camera settings are always sent together
let hwQueue=Promise.resolve(),point=null;
function applyHardware(){
  return hwQueue=hwQueue.then(async()=>{
    if(!track)return true;
    const c=caps(),all={};
    for(const [k,x] of Object.entries(S.hw[facing]))if(k in c)all[k]=x;
    if(c.torch)all.torch=torchOn;
    if(point&&'pointsOfInterest' in navigator.mediaDevices.getSupportedConstraints()){all.pointsOfInterest=[point];if(c.focusMode?.includes('single-shot')&&!('focusDistance' in all))all.focusMode='single-shot'}
    if(!Object.keys(all).length)return true;
    try{await track.applyConstraints({advanced:[all]});return true}catch(e){say('Ye setting is camera par nahi chali');return false}
  });
}
function info(){
  if(!track)return;const s=track.getSettings();
  $('info').textContent=`${s.width||'?'}×${s.height||'?'} • ${Math.round(s.frameRate||0)} fps${S.steady?' • Steady':''}${S.portrait.on?' • Portrait':''}${S.lens!=='None'?' • '+S.lens:''} • ${S.preset}`;
}
$('torch').onclick=async()=>{
  if(!track)return;
  if(!caps().torch){say(facing==='user'?'Front camera me torch nahi hoti (back camera par jaate hi setting rahegi)':'Is camera me torch control nahi mila');return}
  torchOn=!torchOn;$('torch').className=torchOn?'on':'';
  if(!await applyHardware()){torchOn=false;$('torch').className=''}
};

/* ---------- capture and save ---------- */
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function save(blob,name){
  if(!window.Android){say('Save sirf app ke andar hota hai');return}
  say('Save ho raha hai…');
  let ok=Android.begin(name,blob.type.split(';')[0]);
  for(let i=0;ok&&i<blob.size;i+=393216)ok=Android.chunk(await toB64(blob.slice(i,i+393216)));
  ok=ok&&Android.end();
  say(ok?'Gallery me save ho gaya ✅':'Save nahi hua ❌');
}
const queue=(b,n)=>saving=saving.then(()=>save(b,n)).catch(()=>say('Save nahi hua ❌'));
const wait=(p,ms)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
async function fullPhoto(){ // the sensor's own still picture, much sharper than a video frame
  if(!S.hdPhoto||!window.ImageCapture)return null;
  try{
    const ic=new ImageCapture(track),pc=await wait(ic.getPhotoCapabilities(),1500).catch(()=>null),opt={};
    if(pc?.imageWidth?.max){opt.imageWidth=pc.imageWidth.max;opt.imageHeight=pc.imageHeight.max}
    if(torchOn){if(!pc?.fillLightMode?.includes('flash'))return null;opt.fillLightMode='flash'}
    const blob=await wait(ic.takePhoto(opt),6000).catch(()=>wait(ic.takePhoto(),6000));
    let bmp=await createImageBitmap(blob);
    if((bmp.width>bmp.height)!==(video.videoWidth>video.videoHeight))return null; // turned sideways
    const k=Math.min(1,Math.min(4096,gl.getParameter(gl.MAX_TEXTURE_SIZE))/Math.max(bmp.width,bmp.height));
    if(k<1)bmp=await createImageBitmap(blob,{resizeWidth:Math.round(bmp.width*k),resizeHeight:Math.round(bmp.height*k),resizeQuality:'high'});
    return bmp;
  }catch(e){return null}
}
async function photo(){
  if(busy||!stream)return;
  busy=true;say('Photo le raha hai… phone seedha rakho');
  try{
    const g=geometry(video.videoWidth,video.videoHeight,0,1e9),ratio=g.W/g.H,hd=await fullPhoto();
    const src=hd||video,w=hd?hd.width:video.videoWidth,h=hd?hd.height:video.videoHeight,out=el('canvas');
    if(hd){AI.mask=null;think(hd,w,h,true)}
    render(src,w,h,{target:out,still:true,ratio});
    if(hd){AI.mask=null;AI.faces=[];AI.last={};applyHardware()}
    await new Promise(done=>out.toBlob(b=>{if(b)queue(b,'Kezmo_'+Date.now()+'.jpg');else say('Photo nahi bani');done()},'image/jpeg',S.jpeg/100));
  }catch(e){console.warn(e);say('Photo nahi bani')}
  busy=false;
}
function lock(on){for(const id of ['mode','flip','aspectBtn','resetTop','resetLow'])$(id).disabled=on;panel()}
function record(){
  rec=true;render(video,video.videoWidth,video.videoHeight); // switch to full size before the stream starts
  const out=view.captureStream(S.fps);stream.getAudioTracks().forEach(t=>out.addTrack(t.clone()));
  const type=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t)),parts=[];
  rec=new MediaRecorder(out,{mimeType:type,videoBitsPerSecond:[8e6,16e6,40e6][S.res]});
  rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  rec.onstop=()=>{out.getTracks().forEach(t=>t.stop());queue(new Blob(parts,{type}),'Kezmo_'+Date.now()+(type.endsWith('mp4')?'.mp4':'.webm'))};
  const began=Date.now();rec.timer=setInterval(()=>say('● '+new Date(Date.now()-began).toISOString().slice(14,19)),500);
  rec.start(1000);$('shot').classList.add('rec');say('● 00:00');lock(true);
}
function stopRec(){if(!rec)return;clearInterval(rec.timer);rec.stop();rec=null;$('shot').classList.remove('rec');lock(false)}
function cancelTimer(){clearInterval(countdown);countdown=0;$('count').textContent=''}
$('shot').onclick=()=>{
  if(!stream||!video.videoWidth){start();return}
  if(rec){stopRec();return}
  if(countdown){cancelTimer();return}
  const go=()=>videoMode?record():photo();
  if(!S.timer){go();return}
  let n=S.timer;$('count').textContent=n;
  countdown=setInterval(()=>{if(--n>0)$('count').textContent=n;else{cancelTimer();if(stream)go()}},1000);
};
$('mode').onclick=()=>{cancelTimer();videoMode=!videoMode;S.videoMode=videoMode;persist();$('mode').textContent=videoMode?'🎥 Video':'📷 Photo';$('shot').classList.toggle('video',videoMode);start()};
$('flip').onclick=()=>{cancelTimer();facing=facing==='user'?'environment':'user';S.facing=facing;point=null;persist();start()};

/* ---------- controls ---------- */
function chip(text,on,click){return el('button',{textContent:text,className:on?'on':'',onclick:click})}
function slider(label,min,max,value,set,step=1){
  const out=el('output',{textContent:Math.round(value*10)/10}),input=el('input',{type:'range',min,max,step,value});
  input.oninput=()=>{out.textContent=input.value;set(+input.value);persist()};
  return el('label',{},el('span',{textContent:label}),input,out);
}
const choices=(title,names,current,pick)=>el('div',{className:'row'},el('span',{textContent:title}),...names.map((n,i)=>chip(n,i===current,()=>{pick(i);persist();sync();panel()})));
const toggle=(title,on,set)=>choices(title,['Off','On'],on?1:0,i=>set(!!i));
const note=t=>el('div',{className:'note',textContent:t});
function pick(name){S.preset=name;persist();info();panel()}
const filterNames=()=>[...Object.keys(PRESETS),...Object.keys(custom)];
const resetFilter=()=>{delete S.edits[S.preset];delete S.strengths[S.preset];persist();panel();say(S.preset+' filter asli setting par')};
function searchList(names,current,choose){
  const row=el('div',{className:'row'+(query?' wrap':'')}),fill=()=>{
    const found=names.filter(n=>n.toLowerCase().includes(query.trim().toLowerCase()));
    row.className='row'+(query?' wrap':'');row.textContent='';
    row.append(...found.map(n=>chip((S.edits[n]&&names.includes('Normal')?'✎ ':'')+n,current()===n,()=>choose(n))));
    if(!found.length)row.append(note('Kuch nahi mila'));
  };
  const input=el('input',{type:'search',placeholder:`🔍 Search (${names.length})`,value:query});
  input.oninput=()=>{query=input.value;fill()};fill();return [input,row];
}
function panel(){
  const p=$('panel'),keep=p.dataset.tab===tab?[p.scrollTop,p.querySelector('.row')?.scrollLeft]:[0,0];p.dataset.tab=tab;p.textContent='';
  const filterReset=()=>chip('↺ Is filter ko reset',false,resetFilter);
  if(tab==='Filters'){
    p.append(...searchList(filterNames(),()=>S.preset,pick),
      slider('Filter strength',0,100,strength(),x=>S.strengths[S.preset]=x),
      el('div',{className:'row'},chip('✎ Adjust '+S.preset,false,()=>openTab('Adjust')),filterReset(),chip('★ Copy save karo',false,()=>{
        let i=1;while(custom['Mera '+i])i++;
        custom['Mera '+i]=Object.fromEntries(PARAMS.map(q=>[q[0],(cur()[q[0]]||0)*strength()/100]));query='';pick('Mera '+i)}),
        ...(custom[S.preset]?[chip('🗑 Hatao',false,()=>{const n=S.preset;delete custom[n];delete S.edits[n];delete S.strengths[n];pick('Normal')})]:[])));
  }else if(tab==='Adjust'){
    p.append(el('div',{className:'row'},el('span',{textContent:'✎ '+S.preset}),filterReset()),
      note('Ye badlav sirf isi filter me save rehte hain.'),slider('Filter strength',0,100,strength(),x=>S.strengths[S.preset]=x),
      ...PARAMS.map(([k,label,min,max])=>slider(label,min,max,cur()[k]||0,x=>edit(k,x))),el('div',{className:'row'},filterReset()));
  }else if(tab==='Lens'){
    p.append(...searchList(LENS_NAMES,()=>S.lens,n=>{S.lens=n;AI.seen=performance.now();if(n==='None')say('');persist();info();panel()}),
      note('Face lens: chehra saamne rakho. Puppy aur Rainbow me muh kholo.'));
  }else if(tab==='Portrait'){
    p.append(toggle('Portrait mode',S.portrait.on,x=>{S.portrait.on=x;forgetAI()}),
      choices('Pehchan',MODES,S.portrait.mode,i=>{S.portrait.mode=i;AI.failed=false;AI.loading={};forgetAI()}),
      note(S.portrait.mode===0?'AI insaan ko pehchan kar peeche blur karta hai.':S.portrait.mode===1?'Jis cheez ko sharp rakhna hai us par screen par tap karo.':'Gol area ke bahar blur. Tap karke jagah badlo.'),
      ...PORTRAIT.filter(q=>S.portrait.mode===2||!q[0].startsWith('size')).map(([k,label,min,max])=>slider(label,min,max,S.portrait[k],x=>S.portrait[k]=x)),
      el('div',{className:'row'},chip('↺ Portrait reset',false,()=>{S.portrait={...defaultsLow().portrait,on:S.portrait.on,mode:S.portrait.mode};forgetAI();persist();panel()})));
  }else{
    const c=caps(),set=track?track.getSettings():{};
    if(!rec)p.append(choices('Quality',RES.map(r=>r[0]),S.res,i=>{S.res=i;start()}),choices('FPS',['24','30','60'],[24,30,60].indexOf(S.fps),i=>{S.fps=[24,30,60][i];start()}),
      note('4K par kai phone atakte hain. Saaf video ke liye 1080p try karo.'));
    p.append(toggle('HD photo',S.hdPhoto,x=>S.hdPhoto=x),slider('Photo quality',60,100,S.jpeg,x=>S.jpeg=x),
      toggle('Steady shot',S.steady,x=>{S.steady=x;resetSteady()}),slider('Steady power',0,100,S.steadyAmt,x=>S.steadyAmt=x),
      note('Software stabilisation (beta): picture thodi crop hoti hai.'),toggle('Selfie mirror',S.mirror,x=>S.mirror=x));
    const hw=[['zoom','Zoom'],['exposureCompensation','Brightness (EV)'],['focusDistance','Manual focus'],['colorTemperature','White balance K'],['iso','ISO']],mine=S.hw[facing];
    for(const [k,label] of hw){
      const r=c[k];if(!r||!(r.max>r.min))continue;
      p.append(slider(label,r.min,r.max,mine[k]??set[k]??r.min,x=>{mine[k]=x;
        if(k==='focusDistance')mine.focusMode='manual';if(k==='colorTemperature')mine.whiteBalanceMode='manual';if(k==='iso')mine.exposureMode='manual';applyHardware()},r.step||.1));
    }
    if(c.focusMode?.includes('continuous'))p.append(el('div',{className:'row'},chip('Auto focus / exposure wapas',false,async()=>{
      for(const k of ['focusDistance','colorTemperature','iso'])delete mine[k];point=null;
      for(const k of ['focusMode','exposureMode','whiteBalanceMode'])if(c[k]?.includes('continuous'))mine[k]='continuous';persist();await applyHardware();panel();say('Auto par set')})));
    if(!hw.some(([k])=>c[k]))p.append(note('Is camera ne zoom / manual controls nahi diye.'));
  }
  p.scrollTop=keep[0];const row=p.querySelector('.row');if(row&&keep[1])row.scrollLeft=keep[1];
}
function openTab(name){
  const hide=name===tab&&!$('panel').hidden;if(name!==tab)query='';tab=name;$('panel').hidden=hide;
  [...$('tabs').children].forEach(b=>{if(b.id!=='resetLow')b.className=!hide&&b.textContent===name?'on':''});if(!hide)panel();layout();
}
for(const name of ['Filters','Adjust','Lens','Portrait','Camera'])$('tabs').append(el('button',{textContent:name,className:name===tab?'on':'',onclick:()=>openTab(name)}));
let armed=0;
$('tabs').append(el('button',{id:'resetLow',textContent:'↺ Neeche',onclick:()=>{
  if(Date.now()-armed>3000){armed=Date.now();say('Filter, lens, portrait, camera reset karne ke liye dobara dabao');return}
  armed=0;const keep={timer:S.timer,grid:S.grid,aspect:S.aspect,facing,videoMode};
  S={...defaultsLow(),...keep};query='';point=null;comparing=false;AI.failed=false;AI.loading={};persist();panel();start().then(()=>say('Neeche ki sari settings reset ↺'));
}}));
function sync(){
  $('timerBtn').textContent='⏱ '+(S.timer?S.timer+'s':'Off');$('timerBtn').className=S.timer?'on':'';
  $('gridBtn').className=S.grid?'on':'';$('grid').hidden=!S.grid;$('aspectBtn').textContent='⬚ '+ASPECTS[S.aspect][0];
  $('torch').className=torchOn?'on':'';$('mode').textContent=videoMode?'🎥 Video':'📷 Photo';$('shot').classList.toggle('video',videoMode);info();
}
$('timerBtn').onclick=()=>{cancelTimer();S.timer={0:3,3:10,10:0}[S.timer];persist();sync()};
$('gridBtn').onclick=()=>{S.grid=!S.grid;persist();sync()};
$('aspectBtn').onclick=()=>{S.aspect=(S.aspect+1)%ASPECTS.length;resetSteady();persist();sync();setTimeout(info,200)};
$('resetTop').onclick=()=>{cancelTimer();Object.assign(S,DEF_TOP);torchOn=false;persist();sync();applyHardware();say('Upar ki settings reset ↺')};
function shown(){ // where the picture actually sits inside the stage
  const s=$('stage').getBoundingClientRect(),k=Math.min(s.width/view.width,s.height/view.height),w=view.width*k,h=view.height*k;
  return {s,x:(s.width-w)/2,y:(s.height-h)/2,w,h};
}
function layout(){const r=shown();Object.assign($('grid').style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});info()}
addEventListener('resize',layout);
let pinch=null;const fingers=new Map();
const dist=()=>{const [a,b]=[...fingers.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
$('stage').addEventListener('pointerdown',e=>{
  if(e.target.tagName==='BUTTON')return;
  fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(fingers.size===2){pinch={d:dist(),z:S.hw[facing].zoom??track?.getSettings().zoom};return}
  const r=shown(),x=(e.clientX-r.s.left-r.x)/r.w,y=(e.clientY-r.s.top-r.y)/r.h;
  if(x<0||x>1||y<0||y>1||!track)return;
  Object.assign($('ring').style,{left:e.clientX-r.s.left+'px',top:e.clientY-r.s.top+'px',opacity:1});setTimeout(()=>$('ring').style.opacity=0,900);
  // screen position -> position in the camera picture (this undoes crop, mirror and steady shot)
  const u=.5+(x-.5)*lastT.scale[0]+lastT.off[0],v=.5+(.5-y)*lastT.scale[1]+lastT.off[1],spot={x:clamp(u,0,1),y:clamp(1-v,0,1)};
  if(S.portrait.on){S.portrait.x=x;S.portrait.y=1-y;aim={...spot};AI.mask=null;AI.last.object=0;persist()}
  point=spot;applyHardware();
});
$('stage').addEventListener('pointermove',e=>{
  if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const z=caps().zoom;
  if(pinch&&fingers.size===2&&z){const x=clamp(pinch.z*dist()/pinch.d,z.min,z.max);S.hw[facing].zoom=x;persist();applyHardware();say('Zoom '+x.toFixed(1)+'×')}
});
for(const t of ['pointerup','pointercancel','pointerleave'])$('stage').addEventListener(t,e=>{fingers.delete(e.pointerId);if(fingers.size<2)pinch=null});
$('compare').onpointerdown=()=>comparing=true;
for(const t of ['pointerup','pointercancel','pointerleave'])$('compare').addEventListener(t,()=>comparing=false);
$('compare').oncontextmenu=e=>e.preventDefault();
$('perm').onclick=()=>Android.openSettings();
window.appPause=()=>{paused=true;cancelTimer();const r=rec;if(r){r.addEventListener('stop',stop);stopRec()}else stop()};
window.appResume=()=>{if(paused){paused=false;start()}};
initGL();sync();panel();requestAnimationFrame(loop);start();
</script></body></html>
