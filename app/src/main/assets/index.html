<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#ffd23f;--blur:14px;--tint:.14}
html,body{height:100%;background:#000;color:#fff;font:13px system-ui,sans-serif;overflow:hidden;user-select:none}
button{background:#ffffff1c;color:#fff;border:1px solid transparent;border-radius:18px;padding:8px 12px;white-space:nowrap;font:inherit;transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s}
button:active{transform:scale(.9)}
button.on{background:var(--accent);color:#000;font-weight:600}
button:disabled{opacity:.35}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.g{background:#1c1c1ed9;border:1px solid #ffffff14}
button.round{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
/* liquid glass: see-through, blurred, with a bright rim */
body.glass .g,body.glass button.g{background:linear-gradient(135deg,rgba(255,255,255,calc(var(--tint) + .12)),rgba(255,255,255,calc(var(--tint)*.35)) 45%,rgba(255,255,255,var(--tint)));
 -webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(.92);backdrop-filter:blur(var(--blur)) saturate(190%) brightness(.92);
 border:1px solid #ffffff40;box-shadow:inset 1.5px 1.5px 1px #ffffff66,inset -1px -1px 1px #ffffff30,inset 0 0 14px #ffffff14,0 8px 24px #0005}
body.glass button{background:#ffffff1f;border-color:#ffffff2b;box-shadow:inset 1px 1px 1px #ffffff40;text-shadow:0 1px 2px #0006}
body.glass button.on{background:color-mix(in srgb,var(--accent) 72%,transparent);color:#000;text-shadow:none;box-shadow:inset 1.5px 1.5px 1px #fffa,0 2px 12px color-mix(in srgb,var(--accent) 45%,transparent)}
body.glass button.g:not(.on):active{transform:scale(1.12)}
body.glass .sheet{text-shadow:0 1px 3px #000a}
body.glass .sheet:before{content:'';position:absolute;inset:0;border-radius:inherit;background:#0000003d;z-index:-1}
#stage{position:absolute;left:0;right:0;top:56px;bottom:0;overflow:hidden;touch-action:none}
canvas#view{width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block}
#grid,#level{position:absolute;pointer-events:none}
#grid{background:
 linear-gradient(90deg,transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px)),
 linear-gradient(transparent calc(33.33% - 1px),#fff7 33.33%,transparent calc(33.33% + 1px),transparent calc(66.66% - 1px),#fff7 66.66%,transparent calc(66.66% + 1px))}
#level{left:25%;right:25%;top:40%;height:2px;background:#fffc;box-shadow:0 0 4px #000}
#level.flat{background:var(--accent)}
#ring{position:absolute;width:68px;height:68px;margin:-34px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:200;pointer-events:none;text-shadow:0 2px 8px #000}
#perm{position:absolute;top:40%;left:50%;margin-left:-110px;width:220px;background:var(--accent);color:#000}
#top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:3}
#info{font-size:11px;opacity:.75;text-align:center;padding:0 8px}
#msg{position:absolute;left:50%;transform:translateX(-50%);top:66px;max-width:92%;width:max-content;text-align:center;padding:6px 14px;border-radius:16px;z-index:25;pointer-events:none}
#msg:empty{display:none}
#quick{position:absolute;left:8px;right:8px;top:58px;border-radius:26px;padding:12px;z-index:5}
.seg{display:flex;background:#ffffff12;border-radius:16px;padding:3px;margin-bottom:10px}
.seg button{flex:1;background:none!important;border-color:transparent!important;box-shadow:none!important;border-radius:13px}
.seg button.on{background:var(--accent)!important}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.tiles button{border-radius:18px;padding:11px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.item .row{overflow-x:auto}
.line{display:flex;justify-content:space-between;gap:8px}
#compare{position:absolute;left:10px;bottom:218px;z-index:2}
#side{position:absolute;right:10px;bottom:218px;display:flex;flex-direction:column;gap:10px;z-index:2}
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 0 18px;background:linear-gradient(#0000,#000b 45%);z-index:2;pointer-events:none}
#dock>*{pointer-events:auto}
#zoom,#modes{display:flex;gap:4px;width:max-content;margin:0 auto 10px;padding:4px;border-radius:30px}
#zoom button{min-width:40px;height:34px;padding:0 8px;border-radius:17px;background:transparent}
#modes button{background:transparent;border-color:transparent;box-shadow:none;padding:8px 15px}
#zoom button.on,#modes button.on{background:var(--accent)}
body:not(.glass) #modes button.on{background:none;color:var(--accent)}
body:not(.glass) #modes{background:transparent;border-color:transparent}
body:not(.glass) .g{background:rgba(30,30,32,.82);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
body:not(.glass) #modes.g{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
#bar{display:flex;align-items:center;justify-content:space-between;padding:0 34px}
#thumb{width:54px;height:54px;border-radius:16px;padding:0;background-size:cover;background-position:center}
#flip{width:54px;height:54px}
#flip svg{width:28px;height:28px}
#shot{width:78px;height:78px;border-radius:50%;padding:5px;background:transparent;border:4px solid #fff;box-shadow:none}
body.glass #shot{background:#ffffff26;-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);box-shadow:inset 0 0 12px #fff8,0 6px 22px #0006}
#shot i{display:block;width:100%;height:100%;border-radius:50%;background:#ffffffe6;border:3px solid var(--accent);transition:.2s}
#shot.video i{background:#ff3b30;border-color:#ff3b30}
#shot.rec i{border-radius:12px;transform:scale(.55)}
.sheet{position:absolute;left:6px;right:6px;bottom:106px;border-radius:28px;padding:10px;z-index:3;isolation:isolate}
#panel{max-height:34vh;overflow-y:auto;padding:2px}
#tabs{display:flex;gap:4px;margin-bottom:6px}
#tabs button{flex:1 1 auto;padding:7px 2px;font-size:12px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;align-items:center;flex:none}
.row>span{flex:none;min-width:92px}
label{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;padding:5px 0}
label output{text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.note{opacity:.7;font-size:11px;padding:4px 0}
input[type=search],input[type=text]{width:100%;background:#ffffff1c;color:#fff;border:0;border-radius:18px;padding:9px 14px;font:inherit}
.wrap{flex-wrap:wrap;overflow:visible}
#more{position:absolute;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;padding:12px 14px 0}
body.glass #more{background:#0008;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
#more h1{font-size:21px;flex:1}
#moreTabs{display:flex;gap:6px;padding:4px;border-radius:24px;margin:8px 0}
#moreTabs button{flex:1}
#moreBody{overflow-y:auto;padding-bottom:40px}
.card{border-radius:24px;padding:4px 16px;margin-bottom:12px}
.card>*+*{border-top:1px solid #ffffff1f}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0}
.item b{display:block;font-weight:500;font-size:15px}
.item small{display:block;opacity:.6;margin-top:3px}
button.switch{width:52px;height:30px;border-radius:15px;padding:0;position:relative;flex:none;background:#ffffff33}
button.switch:after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .3s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 6px #0006}
button.switch.on:after{left:24px}
.dot{width:34px;height:34px;border-radius:50%;flex:none}
button.dot.on{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
</style></head><body>

const zeros=()=>Object.fromEntries(PARAMS.map(p=>[p[0],0]));
const presetVals=code=>{const o=zeros();for(const k in code)o[PARAMS[CODES.indexOf(k)][0]]=code[k];return o};

const PORTRAIT=[['blur','Background blur',0,100,60],['edge','Kinara (+ zyada sharp)',-50,50,10],['sizeX','Focus width',10,100,45],['sizeY','Focus height',10,100,60],
['feather','Edge softness',1,100,22],['bokeh','Bokeh lights',0,100,0],['bgDark','Background dark',0,100,10],['bgLight','Background white',0,100,0],

const LOOK=Object.fromEntries(PORTRAIT.filter(p=>!['edge','sizeX','sizeY'].includes(p[0])).map(p=>[p[0],p[4]]));
const STYLES={'Natural':{blur:45,smooth:15},'Soft':{blur:55,smooth:50,light:10,bgLight:12,feather:35},'DSLR':{blur:90,bokeh:35,bgSat:10,feather:16},

'Cinematic':{blur:65,bgWarm:-65,bgDark:25,subSat:6},'Golden':{blur:55,bgWarm:75,bokeh:45,light:10},'Motion Zoom':{blur:30,zoomBlur:85},'Vintage':{blur:40,bgWarm:35,bgSat:-45,smooth:25}};
const MODES=['AI Aadmi','AI Cheez (tap)','Oval'];
const DEF_TOP={timer:0,grid:false,aspect:0,level:false,watermark:false};
const DEF_UI={rotate:true,glass:true,blur:14,tint:14,accent:'#ffd23f',sound:true,volume:true,keep:true,markText:'Shot on Kezmo Cam'};
const defaultsLow=()=>({preset:'Normal',edits:{},strengths:{},lens:'None',
portrait:{on:false,mode:0,style:'Natural',x:.5,y:.5,...Object.fromEntries(PORTRAIT.map(p=>[p[0],p[4]]))},
res:1,fps:30,mirror:true,aiFilter:false,nr:1,night:false,steady:false,steadyAmt:60,hdPhoto:true,jpeg:97,hw:{environment:{},user:{}}});
const defaults=()=>({...defaultsLow(),...DEF_TOP,ui:{...DEF_UI},facing:'environment',videoMode:false});
let S=defaults(),custom={};
try{const d=JSON.parse(localStorage.getItem('kezmo3')||'{}');if(d.S)S={...S,...d.S,portrait:{...S.portrait,...d.S.portrait},ui:{...S.ui,...d.S.ui}};custom=d.custom||{}}catch(e){}
if(!S.ui.keep)S={...defaults(),ui:S.ui}; // "Keep settings" is off: start fresh
const persist=()=>{try{localStorage.setItem('kezmo3',JSON.stringify({S,custom}))}catch(e){}};
const original=n=>custom[n]?{...zeros(),...custom[n]}:presetVals(PRESETS[n]||{});
const cur=()=>S.edits[S.preset]||original(S.preset);        // every filter keeps its own edits
const strength=()=>S.strengths[S.preset]??100;
const edit=(k,x)=>{S.edits[S.preset]={...cur(),[k]:x}};

const ASPECTS=[['Full',0],['16:9',9/16],['4:3',3/4],['1:1',1]], RES=[['720p',1280,720],['1080p',1920,1080],['4K',3840,2160]];
let stream=null,track=null,facing=S.facing,videoMode=S.videoMode,rec=null,starting=false,restart=false,paused=false,torchOn=false,comparing=false,aim={x:.5,y:.5},busy=false,
countdown=0,tab='Filters',tilt=0,hdBroken=false,openedRes=-1,moreTab='General',query='',saving=Promise.resolve();

/* ---------- WebGL ---------- */
let gl,progMain,progCopy,progBlur,vtex,mtex,fbos=[],fboW=0,fboH=0;
const glc=document.createElement('canvas');
const VS=`attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS_COPY=`precision mediump float;varying vec2 v;uniform sampler2D tex,maskTex;uniform vec2 scale,off,maskOff;uniform float weighted,bokeh;void main(){
 vec2 uv=.5+(v-.5)*scale+off;
 float a=weighted>.5?max(.1,1.-smoothstep(.15,.6,texture2D(maskTex,uv-maskOff).r)):1.;
 vec3 c=texture2D(tex,uv).rgb;
 a*=(1.+bokeh*4.*pow(dot(c,vec3(.3,.6,.1)),5.))/(1.+bokeh*4.); // bright points weigh more: round light bokeh
 gl_FragColor=vec4(c*a,a);}`;
const FS_BLUR=`precision mediump float;varying vec2 v;uniform sampler2D tex;uniform vec2 dir;void main(){
 vec4 c=texture2D(tex,v)*.227027;
 c+=(texture2D(tex,v+dir*1.3846)+texture2D(tex,v-dir*1.3846))*.316216;

 gl_FragColor=c;}`;
const FS_MAIN=`precision highp float;varying vec2 v;uniform sampler2D tex,soft,maskTex;uniform vec2 scale,off,px;uniform float seed,aspect,srcAspect,useMask;uniform vec4 warp[4];
uniform float ${PARAMS.map(p=>p[0]==='log'?'logAmt':p[0]).join(',')};
uniform float pOn,pX,pY,sizeX,sizeY,feather,bgDark,bgSat,light,smoothAmt,edge,bgLight,subSat,bgWarm,zoomBlur,nr;
uniform vec2 srcPx,maskPx,maskOff,zc;
float lum(vec3 c){return dot(c,vec3(.2126,.7152,.0722));}

  if(name==='face')return {faces:task.detectForVideo(input,ts).faceLandmarks||[]};

  const done=r=>{
    const list=r.confidenceMasks,fine=name==='fine',m=fine?list[0]:list[list.length-1],data=m.getAsFloat32Array(),w=m.width,h=m.height,mask=new Uint8Array(w*h);
    // multiclass model: the first mask is the background. Tap model: the tapped thing must be the sharp side.
    const flip=fine||(point&&data[Math.min(h-1,Math.floor(point.y*h))*w+Math.min(w-1,Math.floor(point.x*w))]<.5);
    for(let i=0;i<w*h;i++)mask[i]=(flip?1-data[i]:data[i])*255;
    out={mask,w,h};if(r.close)r.close();
  };
  if(name==='object')task.segment(input,{keypoint:point},done);else if(name==='fine')task.segment(input,done);else task.segmentForVideo(input,ts,done);
  return out;
}
function aiWorker(){
  let ready=null,chain=Promise.resolve();const tasks={};
  onmessage=e=>{const m=e.data;chain=chain.then(async()=>{
    try{
      ready=ready||(async()=>{self.exports={};self.module={exports:self.exports};importScripts(m.base+'vision_bundle.cjs');
        const lib=self.module.exports.FilesetResolver?self.module.exports:self.exports;return {lib,files:await lib.FilesetResolver.forVisionTasks(m.base+'wasm')}})();
      const {lib,files}=await ready;
      if(!tasks[m.name]){const [cls,file,opt]=m.model;tasks[m.name]=await lib[cls].createFromOptions(files,{baseOptions:{modelAssetPath:m.base+file},...opt})}
      const out=infer(tasks[m.name],m.name,m.input,m.ts,m.point);
      postMessage({id:m.id,out},out.mask?[out.mask.buffer]:[]);
    }catch(err){postMessage({id:m.id,error:String(err)})}
    finally{m.input.close()}
  })};
}
function useMainThread(why){console.warn('AI worker unavailable:',why);AI.mode='main';AI.worker?.terminate();AI.worker=null;for(const p of AI.pending.values())p.no(new Error('retry'));AI.pending.clear()}
function inWorker(name,input,ts,point){
  if(!AI.worker){
    try{AI.worker=new Worker(URL.createObjectURL(new Blob([`${infer};(${aiWorker})()`],{type:'text/javascript'})));
    AI.worker.onmessage=e=>{const p=AI.pending.get(e.data.id);if(!p)return;AI.pending.delete(e.data.id);clearTimeout(p.timer);
      if(e.data.error){if(!AI.workerOK){p.no(new Error('retry'));useMainThread(e.data.error)}else p.no(new Error(e.data.error))}else{AI.workerOK=true;p.ok(e.data.out)}};
    AI.worker.onerror=e=>useMainThread(e.message);
    }catch(e){input.close();useMainThread(e);return Promise.reject(new Error('retry'))}
  }
  return new Promise((ok,no)=>{const id=++AI.id,timer=setTimeout(()=>{AI.pending.delete(id);no(new Error('retry'));if(!AI.workerOK)useMainThread('no answer')},45000);
    AI.pending.set(id,{ok,no,timer});AI.worker.postMessage({id,name,input,ts,point,base:AIBASE,model:MODELS[name]},[input])});
}
async function inPage(name,input,ts,point){

}

/* ---------- software stabiliser: measures shake on a tiny copy of each frame ---------- */
const MARGIN=.07,SW=96,SH=96,R=7;
const steady={cx:0,cy:0,px:0,py:0,sx:0,sy:0,prev:null,canvas:el('canvas',{width:SW,height:SH})};

function shift(a,b,keep){ // how far picture b moved compared with a, in small-frame pixels
  const at=[];for(let y=R;y<SH-R;y+=2)for(let x=R;x<SW-R;x+=2)if(!keep||keep(x,y))at.push(y*SW+x);
  if(at.length<60)return [0,0];
  const score=(dx,dy)=>{let s=0;const d=dy*SW+dx;for(const i of at)s+=Math.abs(b[i+d]-a[i]);return s};
  const zero=score(0,0);let best=zero,bx=0,by=0;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const s=score(dx,dy);if(s<best){best=s;bx=dx;by=dy}}
  if(best>zero*.9)return [0,0]; // not clearly better than standing still
  const fine=(m,c,p)=>{const d=m-2*c+p;return d>0?clamp((m-p)/(2*d),-.5,.5):0};
  return [bx+(Math.abs(bx)<R?fine(score(bx-1,by),best,score(bx+1,by)):0),by+(Math.abs(by)<R?fine(score(bx,by-1),best,score(bx,by+1)):0)];
}
function smallGrey(src){

  return grey;
}
function stabilise(){

    const [dx,dy]=shift(steady.prev,grey),follow=.35-.32*S.steadyAmt/100;
    for(const [p,s,c,d2,n] of [['px','sx','cx',dx,SW],['py','sy','cy',dy,SH]]){

      steady[c]=clamp(steady[p]-steady[s],-MARGIN,MARGIN);steady[s]=steady[p]-steady[c];
    }
  }
  steady.prev=grey;
}

  const fresh=video.currentTime!==lastTime;lastTime=video.currentTime;frames++;
  if(rec&&rec.direct&&frames%4)return; // recording straight from the camera: keep the preview light
  const now=performance.now();if(now-scene.at>350){scene.at=now;analyse(video);if(frames%3===0||!scene.shown)info()}

        custom['Mera '+i]=Object.fromEntries(PARAMS.map(q=>[q[0],(cur()[q[0]]||0)*strength()/100]));query='';pick('Mera '+i)}),
        ...(custom[S.preset]?[chip('🗑 Hatao',false,()=>{const n=S.preset;delete custom[n];delete S.edits[n];delete S.strengths[n];pick('Normal')})]:[])));
  }else if(tab==='Adjust'){
    p.append(el('div',{className:'row'},el('span',{textContent:'✎ '+S.preset}),filterReset()),
      note('Ye badlav sirf isi filter me save rehte hain.'),slider('Filter strength',0,100,strength(),x=>S.strengths[S.preset]=x),
      ...PARAMS.map(([k,label,min,max])=>slider(label,min,max,cur()[k]||0,x=>edit(k,x))),el('div',{className:'row'},filterReset()));
  }else if(tab==='Lens'){
    p.append(...searchList(LENS_NAMES,()=>S.lens,n=>{S.lens=n;AI.seen=performance.now();if(n==='None')say('');persist();info();panel()}),
      note('Face lens: chehra saamne rakho. Puppy aur Rainbow me muh kholo.'));
  }else if(tab==='Portrait'){
    const P=S.portrait,shownLook=lookNow(),style=name=>{S.portrait={...P,...(name==='Auto'?{}:{...LOOK,...STYLES[name]}),style:name,on:true};if(!P.on)forgetAI();refresh()};
    p.append(toggle('Portrait mode',P.on,x=>{P.on=x;if(x){S.night=false}forgetAI()}),
      el('div',{className:'row',id:'styles'},...['Auto',...Object.keys(STYLES)].map(n=>chip(n==='Auto'?'✨ Auto':n,P.style===n,()=>style(n)))),
      choices('Pehchan',MODES,P.mode,i=>{P.mode=i;AI.failed=false;forgetAI()}),
      note(P.mode===0?'AI insaan ko pehchan kar peeche blur karta hai. Saved photo me kinare aur saaf bante hain.':P.mode===1?'Jis cheez ko sharp rakhna hai us par screen par tap karo.':'Gol area ke bahar blur. Tap karke jagah badlo.'),
      ...PORTRAIT.filter(q=>(P.mode===2||!q[0].startsWith('size'))&&(P.mode<2||q[0]!=='edge')).map(([k,label,min,max])=>slider(label,min,max,shownLook[k],x=>{
        if(S.portrait.style!=='Custom'&&k in LOOK){S.portrait={...S.portrait,...lookNow(),style:'Custom'};for(const b of $('styles').children)b.className=''}S.portrait[k]=x})),
      el('div',{className:'row'},chip('↺ Portrait reset',false,()=>{S.portrait={...defaultsLow().portrait,on:P.on,mode:P.mode};forgetAI();refresh()})));
  }else{
    const c=caps(),set=track?track.getSettings():{};
    const hw=[['zoom','Zoom'],['exposureCompensation','Brightness (EV)'],['focusDistance','Manual focus'],['colorTemperature','White balance K'],['iso','ISO']],mine=S.hw[facing];
    for(const [k,label] of hw){
      const r=c[k];if(!r||!(r.max>r.min))continue;
      p.append(slider(label,r.min,r.max,mine[k]??set[k]??(k==='exposureCompensation'?0:r.min),x=>{mine[k]=x;
        if(k==='focusDistance')mine.focusMode='manual';if(k==='colorTemperature')mine.whiteBalanceMode='manual';if(k==='iso')mine.exposureMode='manual';applyHardware();if(k==='zoom')zoomBar()},r.step||.1));
    }
    if(c.focusMode?.includes('continuous'))p.append(el('div',{className:'row'},chip('Auto focus / exposure wapas',false,async()=>{
      for(const k of ['focusDistance','colorTemperature','iso'])delete mine[k];point=null;
      for(const k of ['focusMode','exposureMode','whiteBalanceMode'])if(c[k]?.includes('continuous'))mine[k]='continuous';persist();await applyHardware();panel();say('Auto par set')})));
    if(!hw.some(([k])=>c[k]))p.append(note('Is camera ne zoom / manual controls nahi diye.'));
    p.append(el('div',{className:'row'},chip('Quality, steady, HD photo ›',false,()=>openMore('Video'))));
  }
  p.scrollTop=keep[0];const row=p.querySelector('.row');if(row&&keep[1])row.scrollLeft=keep[1];
}
const TABS=['Filters','Adjust','Lens','Portrait','Camera'];
function showSheet(open){
  $('sheet').hidden=!open;for(const id of ['zoom','modes','side','compare'])$(id).style.visibility=open?'hidden':'';
  if(open)$('quick').hidden=true;
}
function openTab(name){
  if(name!==tab)query='';tab=name;showSheet(true);
  for(const b of $('tabs').children)b.className=b.textContent===name?'on':'';panel();
}
for(const name of TABS)$('tabs').append(el('button',{textContent:name,onclick:()=>openTab(name)}));
for(const name of ['Portrait','Lens','Filters'])$('side').append(iconButton(name,name,{onclick:()=>openTab(name)}));
const compare=iconButton('eye','Original dekhne ke liye dabaye rakho',{id:'compare'});document.body.insertBefore(compare,$('dock'));
let armed=0;
const resetLow=el('button',{id:'resetLow',textContent:'↺ Neeche reset',onclick:()=>{
  if(Date.now()-armed>3000){armed=Date.now();say('Filter, lens, portrait, camera reset karne ke liye dobara dabao');return}
  armed=0;const keep={...Object.fromEntries(Object.keys(DEF_TOP).map(k=>[k,S[k]])),ui:S.ui,facing,videoMode};
  S={...defaultsLow(),...keep};query='';point=null;comparing=false;AI.failed=false;hdBroken=false;openedRes=-1;forgetAI();refresh();start().then(()=>say('Neeche ki sari settings reset ↺'));
}});
$('sheetHead').append(resetLow,iconButton('close','Band karo',{id:'closeSheet',onclick:()=>showSheet(false)}));
$('gear').innerHTML=icon('gear');$('torch').innerHTML=icon('torch');$('flip').innerHTML=icon('flip');

/* quick settings (the "upar" settings) */
function segment(names,current,set){return el('div',{className:'seg'},...names.map((n,i)=>chip(n,i===current,()=>{set(i);refresh()})))}
function quick(){
  const tile=(ic,name,on,click)=>{const b=el('button',{className:on?'on':'',onclick:()=>{click();refresh()}});b.innerHTML=icon(ic);b.append(el('span',{textContent:name}));return b};
  const timers=[0,3,5,10],order=[3,2,1,0];
  $('quick').textContent='';
  $('quick').append(
    segment(order.map(i=>ASPECTS[i][0]),order.indexOf(S.aspect),i=>{if(!rec){S.aspect=order[i];resetSteady()}}),
    segment(timers.map(t=>t?t+'s':'Off'),timers.indexOf(S.timer),i=>{cancelTimer();S.timer=timers[i]}),
    el('div',{className:'tiles'},tile('grid','Grid',S.grid,()=>S.grid=!S.grid),tile('level','Level',S.level,()=>S.level=!S.level),
      tile('mark','Watermark',S.watermark,()=>S.watermark=!S.watermark),tile('sound','Sound',S.ui.sound,()=>S.ui.sound=!S.ui.sound),
      tile('hd','HD photo',S.hdPhoto,()=>{S.hdPhoto=!S.hdPhoto;hdBroken=false}),tile('ai','AI scene',S.aiFilter,()=>S.aiFilter=!S.aiFilter),
      tile('noise',['Noise off','Noise auto','Noise strong'][S.nr],S.nr>0,()=>S.nr=(S.nr+1)%3),tile('glass','Liquid Glass',S.ui.glass,()=>S.ui.glass=!S.ui.glass)),
    el('div',{className:'line'},el('button',{id:'resetTop',textContent:'↺ Upar reset',disabled:!!rec,onclick:()=>{
      cancelTimer();Object.assign(S,DEF_TOP);torchOn=false;refresh();applyHardware();say('Upar ki settings reset ↺')}}),
      el('button',{textContent:'More settings ›',onclick:()=>openMore('General')})));
}
$('gear').onclick=()=>{const open=$('quick').hidden;showSheet(false);$('quick').hidden=!open;if(open)quick()};

/* full settings page */
function item(title,help,control){const text=el('div',{},el('b',{textContent:title}));if(help)text.append(el('small',{textContent:help}));return el('div',{className:'item'},text,control)}
function flick(title,help,on,set){const b=el('button',{className:'switch'+(on?' on':''),onclick:()=>{set(!on);refresh()}});b.setAttribute('aria-label',title);return item(title,help,b)}
const card=(...items)=>el('div',{className:'card g'},...items);
function openMore(name){moreTab=name;$('quick').hidden=true;showSheet(false);$('more').hidden=false;more()}
function more(){
  const m=$('more');if(m.hidden)return;
  const scroll=m.querySelector('#moreBody')?.scrollTop||0,body=el('div',{id:'moreBody'}),U=S.ui;
  m.textContent='';
  m.append(el('div',{className:'head'},iconButton('back','Wapas',{onclick:()=>$('more').hidden=true}),el('h1',{textContent:'More settings'})),
    el('div',{id:'moreTabs',className:'g'},...['General','Photo','Video'].map(n=>chip(n,n===moreTab,()=>{moreTab=n;m.querySelector('#moreBody').scrollTop=0;more()}))),body);
  if(moreTab==='General'){
    const colors=['#ffd23f','#ffffff','#64d2ff','#30d158','#ff6482','#bf8cff'];
    body.append(card(flick('Liquid Glass','Buttons aur panel kaanch jaise',U.glass,x=>U.glass=x),
        ...(U.glass?[slider('Glass blur',0,30,U.blur,x=>{U.blur=x;theme()}),slider('Glass chamak',0,40,U.tint,x=>{U.tint=x;theme()})]:[]),
        item('Button ka rang','',el('div',{className:'row'},...colors.map(c=>{const b=el('button',{className:'dot'+(U.accent===c?' on':''),onclick:()=>{U.accent=c;refresh()}});b.style.background=c;b.setAttribute('aria-label','Rang '+c);return b})))),
      card(flick('Keep settings','Off ho to app har baar nayi settings se khulega',U.keep,x=>U.keep=x),
        flick('Shutter sound','Photo lete waqt awaaz',U.sound,x=>U.sound=x),
        flick('Volume button se photo','Volume dabao, photo ya video shuru',U.volume,x=>U.volume=x),
        flick('Mirrored selfie','Front camera ki photo preview jaisi',S.mirror,x=>S.mirror=x),
        flick('Auto rotate','Phone aada pakdo to photo bhi aadi save ho',U.rotate,x=>U.rotate=x),
        flick('Level line','Phone tedha hai ya seedha',S.level,x=>S.level=x),
        flick('Grid lines','',S.grid,x=>S.grid=x)));
    const text=el('input',{type:'text',value:U.markText,maxLength:40,placeholder:'Apna naam likho'});text.oninput=()=>{U.markText=text.value;persist()};
    body.append(card(flick('Watermark','Photo aur video par aapka text',S.watermark,x=>S.watermark=x),el('div',{className:'item'},text)));
  }else if(moreTab==='Photo'){
    const noiseRow=()=>choices('Noise saaf',['Off','Auto','Strong'],S.nr,i=>S.nr=i);
    body.append(card(flick('HD photo','Camera ki full still photo lene ki koshish',S.hdPhoto,x=>{S.hdPhoto=x;hdBroken=false}),slider('Photo quality',60,100,S.jpeg,x=>S.jpeg=x),noiseRow()),
      note('Auto: andhere me daane (noise) apne aap saaf karta hai.'));
  }else{
    if(rec)body.append(note('Recording ke beech quality nahi badalti.'));
    else{
      const quality=choices('Quality',RES.map(r=>r[0]),S.res,i=>{S.res=i}),four=quality.lastChild;
      if(can4K[facing]===false){four.disabled=true;four.textContent='4K ✕'}
      body.append(card(quality,choices('FPS',['24','30','60'],[24,30,60].indexOf(S.fps),i=>{S.fps=[24,30,60][i];openedRes=-1}),choices('Noise saaf',['Off','Auto','Strong'],S.nr,i=>S.nr=i)),
        note(can4K[facing]===false?'Is camera me 4K nahi hai, jo sabse achha hai wahi chalega.':'Sabse saaf aur smooth 4K: filter Normal, lens/portrait off. Tab video seedha camera se record hota hai.'));
    }
    body.append(card(flick('Steady shot','Software stabilisation (beta), picture thodi crop hoti hai',S.steady,x=>{S.steady=x;resetSteady()}),slider('Steady power',0,100,S.steadyAmt,x=>S.steadyAmt=x)));
  }
  body.scrollTop=scroll;
}

/* modes, zoom, theme */
const MODE_NAMES=['Night','Portrait','Photo','Video'];
const modeNow=()=>videoMode?'Video':S.night?'Night':S.portrait.on?'Portrait':'Photo';
for(const name of MODE_NAMES)$('modes').append(el('button',{textContent:name,onclick:()=>{
  cancelTimer();videoMode=name==='Video';S.videoMode=videoMode;S.night=name==='Night';
  const portrait=name==='Portrait';if(portrait!==S.portrait.on){S.portrait.on=portrait;forgetAI()}
  openedRes=videoMode!==!!stream?.getAudioTracks().length?-1:openedRes;
  refresh();
  if(name==='Portrait')say('Style chunne ke liye side ka 👤 button dabao');if(name==='Night')say('Night: photo lete waqt phone 1 second seedha rakho');
}}));
function zoomBar(){
  const r=caps().zoom,box=$('zoom');box.hidden=!(r&&r.max>r.min);if(box.hidden)return;
  const now=S.hw[facing].zoom??track.getSettings().zoom??1;
  const steps=[...new Set([r.min,1,2,5,10].filter(z=>z>=r.min&&z<=r.max))].slice(0,5);
  box.textContent='';box.append(...steps.map(z=>chip(+z.toFixed(1)+'×',Math.abs(now-z)<.05,()=>{S.hw[facing].zoom=z;persist();applyHardware();zoomBar();if(tab==='Camera')panel()})));
}
function theme(){
  const root=document.documentElement.style,U=S.ui;document.body.classList.toggle('glass',U.glass);
  root.setProperty('--accent',U.accent);root.setProperty('--blur',U.blur+'px');root.setProperty('--tint',U.tint/100);
}
function sync(){
  theme();$('grid').hidden=!S.grid;if(!S.level)$('level').hidden=true;
  $('torch').classList.toggle('on',torchOn);$('shot').classList.toggle('video',videoMode);
  for(const b of $('modes').children)b.className=b.textContent===modeNow()?'on':'';
  window.Android?.setVolumeShutter?.(S.ui.volume);info();layout();
}
addEventListener('devicemotion',e=>{
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  // which way is the phone being held? (kept as it was while the phone lies flat)
  const ax=Math.abs(a.x),ay=Math.abs(a.y);let now=tilt;
  if(ax>4&&ax>ay*1.4){now=a.x>0?-90:90;if(facing==='user'&&!S.mirror)now=-now}else if(ay>4&&ay>ax*1.4)now=a.y>0?0:180;
  if(now!==tilt){tilt=now;info()}
  if(!S.level)return;
  const line=$('level');line.hidden=Math.hypot(a.x,a.y)<3; // lying flat: nothing to level
  const angle=Math.atan2(a.x,a.y)*180/Math.PI;line.style.transform=`rotate(${angle}deg)`;const lean=((angle%90)+90)%90;line.classList.toggle('flat',Math.min(lean,90-lean)<1.5);
});
let audio=null;
function click(){ // short shutter tick
  if(!S.ui.sound)return;
  try{audio=audio||new AudioContext();audio.resume();
    const n=Math.round(audio.sampleRate*.07),buf=audio.createBuffer(1,n,audio.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++){const t=i/n;d[i]=(Math.random()*2-1)*(t<.2?1-t*5:t>.5&&t<.7?(0.7-t)*3:0)*.5}
    const s=audio.createBufferSource();s.buffer=buf;s.connect(audio.destination);s.start()}catch(e){}
}
let thumbURL='';
function setThumb(blob){
  if(blob.type.startsWith('image/')){URL.revokeObjectURL(thumbURL);thumbURL=URL.createObjectURL(blob)}
  else{const c=el('canvas',{width:108,height:108});c.getContext('2d').drawImage(view,0,0,108,108);thumbURL=c.toDataURL()}
  $('thumb').style.backgroundImage=`url(${thumbURL})`;
}
$('thumb').onclick=()=>window.Android?.openLast?.();
window.volumeShot=()=>{if($('more').hidden)$('shot').onclick()};
window.backPressed=()=>{
  if(!$('more').hidden){$('more').hidden=true;return true}
  if(!$('sheet').hidden){showSheet(false);return true}
  if(!$('quick').hidden){$('quick').hidden=true;return true}
  return false;
};
function shown(){ // where the picture actually sits inside the stage
  const s=$('stage').getBoundingClientRect(),k=Math.min(s.width/view.width,s.height/view.height),w=view.width*k,h=view.height*k;
  return {s,x:(s.width-w)/2,y:0,w,h};
}
function layout(){const r=shown();Object.assign($('grid').style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});info()}
addEventListener('resize',layout);
let pinch=null;const fingers=new Map();
const dist=()=>{const [a,b]=[...fingers.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
$('stage').addEventListener('pointerdown',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(!$('quick').hidden||!$('sheet').hidden){$('quick').hidden=true;if(!$('sheet').hidden&&tab!=='Portrait')showSheet(false);if(!S.portrait.on)return}
  fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(fingers.size===2){pinch={d:dist(),z:S.hw[facing].zoom??track?.getSettings().zoom};return}
  const r=shown(),x=(e.clientX-r.s.left-r.x)/r.w,y=(e.clientY-r.s.top-r.y)/r.h;
  if(x<0||x>1||y<0||y>1||!track)return;
  Object.assign($('ring').style,{left:e.clientX-r.s.left+'px',top:e.clientY-r.s.top+'px',opacity:1});setTimeout(()=>$('ring').style.opacity=0,900);
  // screen position -> position in the camera picture (this undoes crop, mirror and steady shot)
  const u=.5+(x-.5)*lastT.scale[0]+lastT.off[0],v=.5+(.5-y)*lastT.scale[1]+lastT.off[1],spot={x:clamp(u,0,1),y:clamp(1-v,0,1)};
  if(S.portrait.on){S.portrait.x=x;S.portrait.y=1-y;if(S.portrait.mode===1){AI.gen++;AI.mask=null;AI.ref=null;aim={...spot};AI.last.object=0}persist()}
  point=spot;applyHardware();
});
$('stage').addEventListener('pointermove',e=>{
  if(!fingers.has(e.pointerId))return;fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const z=caps().zoom;
  if(pinch&&fingers.size===2&&z){const x=clamp(pinch.z*dist()/pinch.d,z.min,z.max);S.hw[facing].zoom=x;persist();applyHardware();zoomBar();say('Zoom '+x.toFixed(1)+'×')}
});
for(const t of ['pointerup','pointercancel','pointerleave'])$('stage').addEventListener(t,e=>{fingers.delete(e.pointerId);if(fingers.size<2)pinch=null});
$('compare').onpointerdown=()=>comparing=true;
for(const t of ['pointerup','pointercancel','pointerleave'])$('compare').addEventListener(t,()=>comparing=false);
$('compare').oncontextmenu=e=>e.preventDefault();
$('perm').onclick=()=>Android.openSettings();
window.appPause=()=>{paused=true;cancelTimer();const r=rec;if(r){r.addEventListener('stop',stop);stopRec()}else stop()};
window.appResume=()=>{if(paused){paused=false;start()}};
initGL();sync();quick();requestAnimationFrame(loop);start();
</script></body></html>
